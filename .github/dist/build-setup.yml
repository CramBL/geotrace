# Harden cargo's crates.io fetches against flaky runner networking. All hosted
# runners intermittently abort downloads before compilation starts: Windows
# with `[16] Error in the HTTP2 framing layer`, macOS with `[55] Broken pipe`.
# Both come from curl's multiplexed HTTP/2 path, so force HTTP/1.1 and retry
# harder.
- name: Harden cargo crates.io fetches
  shell: bash
  run: |
    echo CARGO_HTTP_MULTIPLEXING=false >> "$GITHUB_ENV"
    echo CARGO_NET_RETRY=10 >> "$GITHUB_ENV"

# A workaround for
# https://github.com/axodotdev/cargo-dist/issues/1571
# See the .cargo/config.toml for more information about these flags.
- name: Update RUSTFLAGS with custom windows linker flags
  if: runner.os == 'Windows'
  shell: bash
  run: echo RUSTFLAGS="$RUSTFLAGS -Clink-args=/DEFAULTLIB:ucrt.lib -Clink-args=/NODEFAULTLIB:vcruntime.lib -Clink-args=/NODEFAULTLIB:msvcrt.lib -Clink-args=/NODEFAULTLIB:libucrt.lib" >> "$GITHUB_ENV"
