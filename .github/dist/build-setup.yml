# Force cargo to fetch over HTTP/1.1 on Windows. The windows-hosted runners
# intermittently fail crates.io downloads with `[16] Error in the HTTP2
# framing layer`, which aborts `dist build` before compilation even starts.
# Disabling HTTP/2 multiplexing sidesteps the broken framing path.
- name: Disable cargo HTTP/2 multiplexing on Windows
  if: runner.os == 'Windows'
  shell: bash
  run: echo CARGO_HTTP_MULTIPLEXING=false >> "$GITHUB_ENV"

# A workaround for
# https://github.com/axodotdev/cargo-dist/issues/1571
# See the .cargo/config.toml for more information about these flags.
- name: Update RUSTFLAGS with custom windows linker flags
  if: runner.os == 'Windows'
  shell: bash
  run: echo RUSTFLAGS="$RUSTFLAGS -Clink-args=/DEFAULTLIB:ucrt.lib -Clink-args=/NODEFAULTLIB:vcruntime.lib -Clink-args=/NODEFAULTLIB:msvcrt.lib -Clink-args=/NODEFAULTLIB:libucrt.lib" >> "$GITHUB_ENV"
