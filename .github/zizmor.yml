# Configuration for zizmor (https://docs.zizmor.sh), run in CI via `zizmor .`.
#
# app-release.yml is generated by cargo-dist (`dist generate`) and must not be
# hand-edited — any change is overwritten on the next regeneration. Its findings
# are inherent to dist's generated output: a workflow-level `contents: write`
# permission, template expansion of dist's own plan/matrix values, an unpinned
# cache action, a matrix-driven container image, and the post-announce job that
# calls release-smoke.yml with `secrets: inherit` (dist hardcodes that for custom
# jobs). They are ignored here by file (so the entries survive regeneration)
# rather than with inline comments, which regeneration would strip.
rules:
  excessive-permissions:
    ignore:
      - app-release.yml
  template-injection:
    ignore:
      - app-release.yml
  unpinned-uses:
    ignore:
      - app-release.yml
  unpinned-images:
    ignore:
      - app-release.yml
  cache-poisoning:
    ignore:
      - app-release.yml
  secrets-inherit:
    ignore:
      - app-release.yml
