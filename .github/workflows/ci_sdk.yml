name: CI / SDK

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match the LLVM major the SDK dev image installs (Dockerfile, sdk-dev
  # stage): clang-format output differs between majors. setup-cpp installs
  # clang-format and clang-tidy from apt.llvm.org by major, ignoring any minor
  # or patch given here.
  LLVM_CLANG_MAJOR: "22"

# Use bash on every runner (Git Bash on Windows) so there is a single shell to
# read and maintain instead of a mix of bash and PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # Detect whether anything that affects the SDKs changed, so the expensive
  # cross-language matrix below can be skipped on app-only PRs. The path set
  # covers every cascade source: sdk/** (which includes geotrace-sdk-macros, so
  # a macro change triggers the full suite), the workspace manifests (the SDK
  # crates pull deps via `*.workspace = true`, so a Cargo.toml/Cargo.lock bump
  # changes what they compile against), the C/C++ lint scripts, the shared
  # toolchain action, and this workflow file itself.
  #
  # On non-PR events (push to trunk, schedule, manual dispatch) there is no base
  # to diff against and we always want full coverage, so the SDK suite always
  # runs there.
  changes:
    name: Detect SDK changes
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.decide.outputs.sdk }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Filter SDK paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            sdk:
              - 'sdk/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tests/fixtures/gold_dataset/**'
              - 'scripts/lint-c.sh'
              - 'scripts/lint-cpp.sh'
              - '.github/actions/setup-sdk-toolchain/**'
              - '.github/workflows/ci_sdk.yml'

      # Expansions go through env rather than inline `${{ }}` in the run block,
      # which would be a template-injection sink (flagged by zizmor).
      - name: Decide whether to run the SDK suite
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SDK_CHANGED: ${{ steps.filter.outputs.sdk }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Non-PR event ($EVENT_NAME): running the full SDK suite."
            echo "sdk=true" >> "$GITHUB_OUTPUT"
          else
            echo "sdk=$SDK_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  # Builds the C ABI library and the round-trip fixture once per platform. The C
  # and C++ jobs download the artifact instead of running Cargo themselves.
  # Windows appears twice: the C SDK links under mingw, the C++ SDK under MSVC.
  build-c-lib:
    name: Build geotrace-c / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.sdk == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: ubuntu, lib_dir: target/release, cache_key: sdk-c }
          - { os: macos-latest, label: macos, lib_dir: target/release, cache_key: sdk-c }
          - { os: windows-latest, label: windows-msvc, lib_dir: target/release, cache_key: sdk-c }
          - { os: windows-latest, label: windows-gnu, rust_target: x86_64-pc-windows-gnu, lib_dir: target/x86_64-pc-windows-gnu/release, cache_key: sdk-c-gnu }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      # MinGW's gcc links the gnu target and is not on PATH by default.
      - name: Set Cargo build target
        if: matrix.rust_target != ''
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup target add "$RUST_TARGET"
          echo "CARGO_BUILD_TARGET=$RUST_TARGET" >> "$GITHUB_ENV"
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Build geotrace-c
        run: cargo build -p geotrace-c --release

      - name: Generate fixture
        run: cargo run -p geotrace-c --bin gen_fixture --release

      # if-no-files-found is satisfied by the fixture alone, so check the library.
      - name: Check the library was produced
        env:
          LIB_DIR: ${{ matrix.lib_dir }}
        run: ls "$LIB_DIR"/*geotrace_c* "$LIB_DIR"/deps/*geotrace_c*

      # Paths stay repo-relative so a consumer unpacks them over its checkout.
      # Cargo hardlinks the library up from deps/ but bakes the deps/ path into
      # the dylib's install name, so that copy has to travel too.
      - name: Upload the library and fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geotrace-c-lib-${{ matrix.label }}
          path: |
            ${{ matrix.lib_dir }}/*geotrace_c*
            ${{ matrix.lib_dir }}/deps/*geotrace_c*
            sdk/c/tests/fixtures/minimal.gtd
          retention-days: 1
          if-no-files-found: error

  # clang-format and clang-tidy over the C SDK. This job needs criterion and the
  # geotrace_c library from build-c-lib: scripts/lint-c.sh configures the C SDK
  # with its tests and examples on.
  lint-c:
    name: C SDK Lint
    runs-on: ubuntu-latest
    needs: [changes, build-c-lib]
    if: needs.changes.outputs.sdk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install clang tools and cmake
        uses: aminya/setup-cpp@1f17f92d6a52bfcb1a25348e2c526c2e5cbb1134 # v1.8.0
        with:
          clang-format: ${{ env.LLVM_CLANG_MAJOR }}
          clang-tidy: ${{ env.LLVM_CLANG_MAJOR }}
          cmake: true
          ninja: true

      - name: Install criterion
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcriterion-dev

      - name: Download geotrace-c
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geotrace-c-lib-ubuntu

      - name: Lint C SDK
        env:
          GEOTRACE_C_LIB_DIR: ${{ github.workspace }}/target/release
        run: bash scripts/lint-c.sh

  # clang-format and clang-tidy over the C++ SDK. This job needs the geotrace_c
  # library too: scripts/lint-cpp.sh installs the C SDK to a temporary prefix
  # for find_package(GeoTraceC). The clang toolchain is the only package it
  # installs: that C SDK install configures tests off, and the C++ tests take
  # doctest from FetchContent.
  lint-cpp:
    name: C++ SDK Lint
    runs-on: ubuntu-latest
    needs: [changes, build-c-lib]
    if: needs.changes.outputs.sdk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install clang tools and cmake
        uses: aminya/setup-cpp@1f17f92d6a52bfcb1a25348e2c526c2e5cbb1134 # v1.8.0
        with:
          clang-format: ${{ env.LLVM_CLANG_MAJOR }}
          clang-tidy: ${{ env.LLVM_CLANG_MAJOR }}
          cmake: true
          ninja: true

      - name: Download geotrace-c
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geotrace-c-lib-ubuntu

      - name: Lint C++ SDK
        env:
          GEOTRACE_C_LIB_DIR: ${{ github.workspace }}/target/release
        run: bash scripts/lint-cpp.sh

  # rustfmt and clippy over the two isolated cargo workspaces, geotrace-py and
  # the fuzz targets: ci.yml runs its cargo commands over the root workspace
  # alone.
  lint-rust-sdk:
    name: Rust SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sdk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Restore-only: the python-sdk job writes this key on trunk.
      - name: Cache Cargo (geotrace-py workspace)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "sdk/python/geotrace-py -> sdk/python/geotrace-py/target"
          shared-key: sdk-py
          save-if: false

      - name: Check geotrace-py formatting
        run: cargo fmt --manifest-path sdk/python/geotrace-py/Cargo.toml --check

      # geotrace-py compiles under abi3-py312 and this job sets up no
      # interpreter. PYO3_BUILD_EXTENSION_MODULE=1 makes pyo3 configure without
      # one.
      - name: Lint geotrace-py
        env:
          PYO3_BUILD_EXTENSION_MODULE: "1"
        run: cargo clippy --manifest-path sdk/python/geotrace-py/Cargo.toml --workspace --no-deps --all-targets -- -D warnings

      - name: Check fuzz workspace formatting
        run: cargo fmt --manifest-path sdk/rust/geotrace-sdk/fuzz/Cargo.toml --check

      - name: Lint fuzz workspace
        run: cargo clippy --manifest-path sdk/rust/geotrace-sdk/fuzz/Cargo.toml --workspace --no-deps --all-targets -- -D warnings

  # Verify that geotrace-sdk compiles and its tests pass on its declared MSRV.
  # The SDK is a separately published crate with a lower MSRV than the main app.
  sdk-msrv:
    name: SDK MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sdk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: "1.89"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sdk-msrv
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Check
        run: cargo +1.89 check -p geotrace-sdk -p geotrace-sdk-macros

      - name: Test
        run: cargo +1.89 test -p geotrace-sdk

  # Ensure the published SDK docs build cleanly with no warnings (broken
  # intra-doc links, missing docs on public items, etc).
  sdk-doc:
    name: SDK Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sdk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          save-if: false

      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p geotrace-sdk --no-deps

  c-sdk:
    name: C SDK / ${{ matrix.os }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: [changes, build-c-lib]
    if: needs.changes.outputs.sdk == 'true'

    strategy:
      fail-fast: false
      # macOS is built under both the system AppleClang and Homebrew llvm.
      matrix:
        include:
          - { os: ubuntu-latest, cc: llvm-20, label: llvm-20, lib: ubuntu }
          - { os: macos-latest, cc: appleclang, label: appleclang, lib: macos }
          - { os: macos-latest, cc: llvm-20, label: llvm-20, lib: macos }
          - { os: windows-latest, cc: mingw, label: mingw, lib: windows-gnu }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up SDK toolchain
        uses: ./.github/actions/setup-sdk-toolchain
        with:
          compiler: ${{ matrix.cc }}
          cmake: ${{ runner.os == 'Windows' }}
          ninja: ${{ runner.os == 'Windows' }}
          criterion: true

      - name: Download geotrace-c
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geotrace-c-lib-${{ matrix.lib }}

      - name: Configure C SDK tests (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          EXTRA=""
          [ "$RUNNER_OS" = "macOS" ] && EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          cmake -S sdk/c -B build/c \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEOTRACE_C_LIB_DIR=${{ github.workspace }}/target/release \
            -DGEOTRACE_C_BUILD_TESTS=ON \
            -DGEOTRACE_C_BUILD_EXAMPLES=ON \
            $EXTRA

      - name: Configure C SDK tests (Windows)
        if: runner.os == 'Windows'
        env:
          PKG_CONFIG_PATH: C:\criterion\lib\pkgconfig
        run: |
          cmake -S sdk/c -B build/c \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEOTRACE_C_LIB_DIR="${{ github.workspace }}/target/x86_64-pc-windows-gnu/release" \
            -DGEOTRACE_C_BUILD_TESTS=ON \
            -DGEOTRACE_C_BUILD_EXAMPLES=ON

      - name: Build C SDK
        run: cmake --build build/c

      - name: Run C SDK tests (Linux, macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build/c --output-on-failure

      - name: Run C SDK tests (Windows)
        if: runner.os == 'Windows'
        run: |
          export PATH="/c/criterion/bin:$PATH"
          ctest --test-dir build/c --output-on-failure

  # Installs the C SDK to a local prefix so find_package(GeoTraceC) works,
  # configures and builds the C++ SDK with BUILD_TESTING=ON, then runs ctest.
  cpp-sdk:
    name: C++ SDK / ${{ matrix.os }} / C++${{ matrix.cxx_std }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: [changes, build-c-lib]
    if: needs.changes.outputs.sdk == 'true'

    strategy:
      fail-fast: false
      # Fully enumerated so macOS can be tested under both the system AppleClang
      # and Homebrew llvm.
      matrix:
        include:
          - { os: ubuntu-latest, cxx_std: "17", cc: llvm-20, label: llvm-20, lib: ubuntu }
          - { os: ubuntu-latest, cxx_std: "20", cc: llvm-20, label: llvm-20, lib: ubuntu }
          - { os: macos-latest, cxx_std: "17", cc: appleclang, label: appleclang, lib: macos }
          - { os: macos-latest, cxx_std: "20", cc: appleclang, label: appleclang, lib: macos }
          - { os: macos-latest, cxx_std: "17", cc: llvm-20, label: llvm-20, lib: macos }
          - { os: macos-latest, cxx_std: "20", cc: llvm-20, label: llvm-20, lib: macos }
          - { os: windows-latest, cxx_std: "17", cc: msvc, label: MSBuild, lib: windows-msvc, generator: "", cmake_extra_args: "-A x64" }
          - { os: windows-latest, cxx_std: "17", cc: msvc, label: Ninja, lib: windows-msvc, generator: Ninja, cmake_extra_args: "-DCMAKE_BUILD_TYPE=Release" }
          - { os: windows-latest, cxx_std: "20", cc: msvc, label: MSBuild, lib: windows-msvc, generator: "", cmake_extra_args: "-A x64" }
          - { os: windows-latest, cxx_std: "20", cc: msvc, label: Ninja, lib: windows-msvc, generator: Ninja, cmake_extra_args: "-DCMAKE_BUILD_TYPE=Release" }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up SDK toolchain
        uses: ./.github/actions/setup-sdk-toolchain
        with:
          compiler: ${{ matrix.cc }}
          ninja: ${{ matrix.cc != 'appleclang' }}

      - name: Download geotrace-c
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geotrace-c-lib-${{ matrix.lib }}

      - name: Install C SDK to local prefix (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S sdk/c -B build/c \
            -DGEOTRACE_C_LIB_DIR=${{ github.workspace }}/target/release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          cmake --install build/c

      - name: Install C SDK to local prefix (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S sdk/c -B build/c \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEOTRACE_C_LIB_DIR="${{ github.workspace }}/target/release" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
          cmake --install build/c

      - name: Configure C++ SDK tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S sdk/cpp -B build/cpp \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DBUILD_TESTING=ON \
            -DGEOTRACE_CPP_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }}

      - name: Configure C++ SDK tests (Windows)
        if: runner.os == 'Windows'
        run: |
          GEN=""
          [ -n "${{ matrix.generator }}" ] && GEN="-G ${{ matrix.generator }}"
          cmake -S sdk/cpp -B build/cpp \
            $GEN ${{ matrix.cmake_extra_args }} \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" \
            -DBUILD_TESTING=ON \
            -DGEOTRACE_CPP_BUILD_EXAMPLES=ON \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }}

      - name: Build C++ SDK tests
        run: cmake --build build/cpp --config Release

      - name: Run C++ SDK tests (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build/cpp --output-on-failure

      - name: Run C++ SDK tests (Windows)
        if: runner.os == 'Windows'
        working-directory: build/cpp
        run: ctest -C Release --output-on-failure

  python-sdk:
    name: Python SDK / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.sdk == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      # The Python version is not part of the cache key, so one leg writes for all.
      - name: Cache Cargo (geotrace-py workspace)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "sdk/python/geotrace-py -> sdk/python/geotrace-py/target"
          shared-key: sdk-py
          save-if: ${{ github.ref == 'refs/heads/trunk' && matrix.python-version == '3.13' }}
          cache-on-failure: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build Python extension
        working-directory: sdk/python/geotrace-py
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install maturin pytest ruff mypy
          uv run maturin develop

      - name: Lint
        working-directory: sdk/python/geotrace-py
        run: uv run ruff check .

      - name: Type-check
        working-directory: sdk/python/geotrace-py
        run: uv run mypy . --strict

      - name: Test
        working-directory: sdk/python/geotrace-py
        run: uv run pytest tests/ -v

      - name: Run examples
        working-directory: sdk/python/geotrace-py
        run: |
          set -euo pipefail
          for file in examples/*.py; do
            filename=$(basename "$file")
            echo "running example: ${filename}"
            uv run python "${file}"
          done

  # Install the C SDK via a local vcpkg overlay port and verify a downstream
  # consumer project builds and runs correctly.  This validates the portfile
  # and the integration-test consumer in sdk/integration-tests/vcpkg/.
  vcpkg-sdk:
    name: vcpkg overlay port
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sdk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      # The overlay port runs its own `cargo build`.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sdk-c
          save-if: false

      - name: Set up SDK toolchain
        uses: ./.github/actions/setup-sdk-toolchain
        with:
          cmake: true
          ninja: true

      - name: Bootstrap vcpkg
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install geotrace-c via overlay port
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          "${{ github.workspace }}/vcpkg/vcpkg" install geotrace-c \
            --overlay-ports=sdk/integration-tests/vcpkg-port \
            --triplet x64-linux \
            --no-print-usage

      - name: Configure vcpkg consumer
        run: |
          cmake -S sdk/integration-tests/vcpkg -B build/vcpkg-smoke \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build vcpkg consumer
        run: cmake --build build/vcpkg-smoke

      - name: Run vcpkg smoke test
        run: build/vcpkg-smoke/smoke_c

  ci-sdk:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-c-lib
      - lint-c
      - lint-cpp
      - lint-rust-sdk
      - sdk-msrv
      - sdk-doc
      - c-sdk
      - cpp-sdk
      - python-sdk
      - vcpkg-sdk
    permissions:
      contents: none
    if: always()
    steps:
      # Assert the good state explicitly rather than denylisting bad ones (a
      # cancelled run, a new result type, etc. must never slip through as a
      # pass). This job always runs so the required status check always reports.
      #
      # The `changes` job must have succeeded. If it reports no SDK changes, the
      # suite was intentionally skipped and the gate passes. Otherwise every
      # dependency must have a 'success' result.
      - name: Verify the SDK suite succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SDK_CHANGED: ${{ needs.changes.outputs.sdk }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The 'changes' detection job did not succeed (result: $CHANGES_RESULT)."
            exit 1
          fi
          if [ "$SDK_CHANGED" != "true" ]; then
            echo "No SDK changes detected; the SDK suite was intentionally skipped. OK."
            exit 0
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A dependency did not succeed (results: $RESULTS)."
              exit 1
            fi
          done
          echo "All SDK jobs succeeded."
