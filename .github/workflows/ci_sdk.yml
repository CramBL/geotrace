name: CI / SDK

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Use bash on every runner (Git Bash on Windows) so there is a single shell to
# read and maintain instead of a mix of bash and PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # clang-format and clang-tidy for the C and C++ SDKs.
  lint-sdk:
    name: SDK Lint / C & C++
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install clang tools and cmake
        uses: aminya/setup-cpp@1f17f92d6a52bfcb1a25348e2c526c2e5cbb1134 # v1.8.0
        with:
          clang-format: true
          clang-tidy: true
          cmake: true
          ninja: true

      - name: Install criterion
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcriterion-dev

      - name: Build geotrace-c
        run: cargo build -p geotrace-c --release

      - name: Lint C SDK
        env:
          GEOTRACE_C_LIB_DIR: ${{ github.workspace }}/target/release
        run: bash scripts/lint-c.sh

      - name: Lint C++ SDK
        env:
          GEOTRACE_C_LIB_DIR: ${{ github.workspace }}/target/release
        run: bash scripts/lint-cpp.sh

  # Verify that geotrace-sdk compiles and its tests pass on its declared MSRV.
  # The SDK is a separately published crate with a lower MSRV than the main app.
  sdk-msrv:
    name: SDK MSRV (Rust 1.89)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: "1.89"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check
        run: cargo +1.89 check -p geotrace-sdk -p geotrace-sdk-macros

      - name: Test
        run: cargo +1.89 test -p geotrace-sdk

  # Ensure the published SDK docs build cleanly with no warnings (broken
  # intra-doc links, missing docs on public items, etc).
  sdk-doc:
    name: SDK Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p geotrace-sdk --no-deps

  c-sdk:
    name: C SDK / ${{ matrix.os }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      # macOS is built under both the system AppleClang and Homebrew llvm.
      matrix:
        include:
          - { os: ubuntu-latest, cc: llvm-20, label: llvm-20 }
          - { os: macos-latest, cc: appleclang, label: appleclang }
          - { os: macos-latest, cc: llvm-20, label: llvm-20 }
          - { os: windows-latest, cc: mingw, label: mingw }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Set up SDK toolchain
        uses: ./.github/actions/setup-sdk-toolchain
        with:
          compiler: ${{ matrix.cc }}
          cmake: ${{ runner.os == 'Windows' }}
          ninja: ${{ runner.os == 'Windows' }}
          criterion: true

      - name: Set Cargo build target (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup target add x86_64-pc-windows-gnu
          echo "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" >> "$GITHUB_ENV"

      - name: Build geotrace-c
        run: cargo build -p geotrace-c --release

      - name: Generate fixture
        run: cargo run -p geotrace-c --bin gen_fixture --release

      - name: Configure C SDK tests (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          EXTRA=""
          [ "$RUNNER_OS" = "macOS" ] && EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          cmake -S sdk/c -B build/c \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEOTRACE_C_LIB_DIR=${{ github.workspace }}/target/release \
            -DGEOTRACE_C_BUILD_TESTS=ON \
            -DGEOTRACE_C_BUILD_EXAMPLES=ON \
            $EXTRA

      - name: Configure C SDK tests (Windows)
        if: runner.os == 'Windows'
        env:
          PKG_CONFIG_PATH: C:\criterion\lib\pkgconfig
        run: |
          cmake -S sdk/c -B build/c \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEOTRACE_C_LIB_DIR="${{ github.workspace }}/target/x86_64-pc-windows-gnu/release" \
            -DGEOTRACE_C_BUILD_TESTS=ON \
            -DGEOTRACE_C_BUILD_EXAMPLES=ON

      - name: Build C SDK
        run: cmake --build build/c

      - name: Run C SDK tests (Linux, macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build/c --output-on-failure

      - name: Run C SDK tests (Windows)
        if: runner.os == 'Windows'
        run: |
          export PATH="/c/criterion/bin:$PATH"
          ctest --test-dir build/c --output-on-failure

  # Builds geotrace-c with Cargo (shared lib on Unix, static lib on Windows),
  # installs the C SDK to a local prefix so find_package(GeoTraceC) works,
  # configures and builds the C++ SDK with BUILD_TESTING=ON, then runs ctest.
  cpp-sdk:
    name: C++ SDK / ${{ matrix.os }} / C++${{ matrix.cxx_std }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      # Fully enumerated so macOS can be tested under both the system AppleClang
      # and Homebrew llvm.
      matrix:
        include:
          - { os: ubuntu-latest, cxx_std: "17", cc: llvm-20, label: llvm-20 }
          - { os: ubuntu-latest, cxx_std: "20", cc: llvm-20, label: llvm-20 }
          - { os: macos-latest, cxx_std: "17", cc: appleclang, label: appleclang }
          - { os: macos-latest, cxx_std: "20", cc: appleclang, label: appleclang }
          - { os: macos-latest, cxx_std: "17", cc: llvm-20, label: llvm-20 }
          - { os: macos-latest, cxx_std: "20", cc: llvm-20, label: llvm-20 }
          - { os: windows-latest, cxx_std: "17", cc: msvc, label: MSBuild, generator: "", cmake_extra_args: "-A x64" }
          - { os: windows-latest, cxx_std: "17", cc: msvc, label: Ninja, generator: Ninja, cmake_extra_args: "-DCMAKE_BUILD_TYPE=Release" }
          - { os: windows-latest, cxx_std: "20", cc: msvc, label: MSBuild, generator: "", cmake_extra_args: "-A x64" }
          - { os: windows-latest, cxx_std: "20", cc: msvc, label: Ninja, generator: Ninja, cmake_extra_args: "-DCMAKE_BUILD_TYPE=Release" }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Set up SDK toolchain
        uses: ./.github/actions/setup-sdk-toolchain
        with:
          compiler: ${{ matrix.cc }}
          ninja: ${{ matrix.cc != 'appleclang' }}

      - name: Build geotrace-c
        run: cargo build -p geotrace-c --release

      - name: Generate fixture
        run: cargo run -p geotrace-c --bin gen_fixture --release

      - name: Install C SDK to local prefix (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S sdk/c -B build/c \
            -DGEOTRACE_C_LIB_DIR=${{ github.workspace }}/target/release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          cmake --install build/c

      - name: Install C SDK to local prefix (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S sdk/c -B build/c \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEOTRACE_C_LIB_DIR="${{ github.workspace }}/target/release" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
          cmake --install build/c

      - name: Configure C++ SDK tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S sdk/cpp -B build/cpp \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DBUILD_TESTING=ON \
            -DGEOTRACE_CPP_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }}

      - name: Configure C++ SDK tests (Windows)
        if: runner.os == 'Windows'
        run: |
          GEN=""
          [ -n "${{ matrix.generator }}" ] && GEN="-G ${{ matrix.generator }}"
          cmake -S sdk/cpp -B build/cpp \
            $GEN ${{ matrix.cmake_extra_args }} \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" \
            -DBUILD_TESTING=ON \
            -DGEOTRACE_CPP_BUILD_EXAMPLES=ON \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }}

      - name: Build C++ SDK tests
        run: cmake --build build/cpp --config Release

      - name: Run C++ SDK tests (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build/cpp --output-on-failure

      - name: Run C++ SDK tests (Windows)
        if: runner.os == 'Windows'
        working-directory: build/cpp
        run: ctest -C Release --output-on-failure

  python-sdk:
    name: Python SDK / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo (geotrace-py workspace)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "sdk/python/geotrace-py -> sdk/python/geotrace-py/target"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build Python extension
        working-directory: sdk/python/geotrace-py
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install maturin pytest ruff mypy
          uv run maturin develop

      - name: Lint
        working-directory: sdk/python/geotrace-py
        run: uv run ruff check .

      - name: Type-check
        working-directory: sdk/python/geotrace-py
        run: uv run mypy . --strict

      - name: Test
        working-directory: sdk/python/geotrace-py
        run: uv run pytest tests/ -v

      - name: Run examples
        working-directory: sdk/python/geotrace-py
        run: |
          set -euo pipefail
          for file in examples/*.py; do
            filename=$(basename "$file")
            echo "running example: ${filename}"
            uv run python "${file}"
          done

  # Install the C SDK via a local vcpkg overlay port and verify a downstream
  # consumer project builds and runs correctly.  This validates the portfile
  # and the integration-test consumer in sdk/integration-tests/vcpkg/.
  vcpkg-sdk:
    name: vcpkg overlay port
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Set up SDK toolchain
        uses: ./.github/actions/setup-sdk-toolchain
        with:
          cmake: true
          ninja: true

      - name: Bootstrap vcpkg
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install geotrace-c via overlay port
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          "${{ github.workspace }}/vcpkg/vcpkg" install geotrace-c \
            --overlay-ports=sdk/integration-tests/vcpkg-port \
            --triplet x64-linux \
            --no-print-usage

      - name: Configure vcpkg consumer
        run: |
          cmake -S sdk/integration-tests/vcpkg -B build/vcpkg-smoke \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build vcpkg consumer
        run: cmake --build build/vcpkg-smoke

      - name: Run vcpkg smoke test
        run: build/vcpkg-smoke/smoke_c

  ci-sdk:
    runs-on: ubuntu-latest
    needs: 
      - lint-sdk
      - sdk-msrv
      - sdk-doc
      - c-sdk
      - cpp-sdk
      - python-sdk
      - vcpkg-sdk
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
