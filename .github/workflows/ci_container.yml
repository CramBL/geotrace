name: CI / Container

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  container:
    name: Container (just ci)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # `just ci` builds the dev container images and runs the SDK suites with
      # vcpkg, which together exhaust the default runner disk. Reclaim the space
      # taken by toolchains this job never uses (~25 GB).
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just,nextest,cargo-msrv

      # The dev image no longer ships cargo-pup or cargo-msrv, so the `pup`,
      # `msrv`, and `sdk-msrv` recipes run natively on this host (as does the
      # `test` recipe, whose gt-arch test shells out to `cargo pup`). cargo-pup
      # must be built with the pinned nightly the workspace's pup.ron targets.
      - name: Install Rust nightly (for cargo-pup)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: nightly-2026-01-22
          components: rust-src,rustc-dev,llvm-tools-preview

      - name: Install cargo-pup
        run: cargo +nightly-2026-01-22 install cargo_pup

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up software GPU rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=gl" >> "$GITHUB_ENV"

      - name: Run just ci
        run: just ci

  ci-container:
    runs-on: ubuntu-latest
    needs: [container]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
