name: Smoke / C++ SDK

# Install the published C++ SDK and build + run the checked-in smoke consumer
# against it via find_package(GeoTraceCpp). The consumer writes a one-fix file
# and prints GEOTRACE_CPP_VERSION. Each step is one command, so the workflow
# doubles as a step-by-step guide.
#
# Install paths, one job each:
#   - tarball-unix (Linux + macOS): download the release archive and point CMake
#     at it. Runs on every release, including prereleases.
#   - tarball-windows: the same, with the MSVC archive.
#   - brew (Linux + macOS): `brew install`, stable releases only, since the
#     Homebrew formula isn't published for prereleases.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      prerelease:
        required: true
        type: string

permissions:
  contents: read

env:
  REPO: CramBL/geotrace
  TAP: CramBL/homebrew-tap
  CONSUMER_CMAKE: |
    cmake_minimum_required(VERSION 3.21)
    project(consumer CXX)
    set(CMAKE_CXX_STANDARD 17)
    set(CMAKE_CXX_STANDARD_REQUIRED ON)
    set(CMAKE_CXX_EXTENSIONS OFF)

    find_package(GeoTraceCpp REQUIRED)

    add_executable(smoke_cpp
      "${CMAKE_CURRENT_LIST_DIR}/../sdk/integration-tests/cmake-find-package/smoke_cpp.cpp")
    target_link_libraries(smoke_cpp PRIVATE GeoTrace::Cpp)
    target_compile_definitions(smoke_cpp PRIVATE
      GEOTRACE_SMOKE_PATH="${CMAKE_CURRENT_BINARY_DIR}/smoke_cpp.gtd")

    set_target_properties(smoke_cpp PROPERTIES BUILD_RPATH "$<TARGET_FILE_DIR:GeoTrace::C>")

defaults:
  run:
    shell: bash

jobs:
  tarball-unix:
    name: tarball / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-14, target: aarch64-apple-darwin }
    env:
      ARCHIVE: geotrace-sdk-${{ matrix.target }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write the consumer CMake project
        run: |
          mkdir -p consumer
          printf '%s' "$CONSUMER_CMAKE" > consumer/CMakeLists.txt

      - name: Download the SDK archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$REPO" --pattern "$ARCHIVE"

      - name: Extract it into a prefix
        run: |
          mkdir -p prefix
          tar -xzf "$ARCHIVE" -C prefix

      - name: Configure the consumer
        run: cmake -S consumer -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/prefix"

      - name: Build the consumer
        run: cmake --build build

      - name: Run it and check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./build/smoke_cpp | tee output.txt
          grep -qw "$VERSION" output.txt

  brew:
    name: brew / ${{ matrix.runner }}
    # The Homebrew formula is only published for stable releases.
    if: inputs.prerelease == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15-intel, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write the consumer CMake project
        run: |
          mkdir -p consumer
          printf '%s' "$CONSUMER_CMAKE" > consumer/CMakeLists.txt

      # GitHub's macOS runners ship Homebrew, but the Linux runners do not, so
      # install Linuxbrew the way the Homebrew docs prescribe and put it on PATH
      # for the remaining steps.
      - name: Install Homebrew
        if: runner.os == 'Linux'
        run: |
          NONINTERACTIVE=1 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install the C/C++ SDK with Homebrew
        run: brew install "${TAP}/geotrace-c"

      - name: Configure the consumer
        run: cmake -S consumer -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)"

      - name: Build the consumer
        run: cmake --build build

      - name: Run it and check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./build/smoke_cpp | tee output.txt
          grep -qw "$VERSION" output.txt

  tarball-windows:
    name: tarball / windows
    runs-on: windows-latest
    env:
      ARCHIVE: geotrace-sdk-x86_64-pc-windows-msvc.zip
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write the consumer CMake project
        run: |
          mkdir -p consumer
          printf '%s' "$CONSUMER_CMAKE" > consumer/CMakeLists.txt

      - name: Download the Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$REPO" --pattern "$ARCHIVE"

      - name: Extract it into a prefix
        run: 7z x -y -oprefix "$ARCHIVE" >/dev/null

      - name: Configure the consumer (MSVC)
        run: cmake -S consumer -B build -A x64 -DCMAKE_PREFIX_PATH="$(cygpath -m "$PWD/prefix")"

      - name: Build the consumer
        run: cmake --build build --config Release

      - name: Run it and check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./build/Release/smoke_cpp.exe | tee output.txt
          grep -qw "$VERSION" output.txt
