name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Run monthly on the 1st at 03:00 UTC to catch regressions from upstream dependencies.
    - cron: "0 3 1 * *"

# Minimal permissions - CI only reads the repository.
permissions:
  contents: read

# Cancel in-flight runs for the same PR on a new push. Never cancel default-branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cargo caches, in every CI workflow: only trunk writes, and only one job per
# `shared-key` group. A cache written on a PR ref is readable only by that PR yet
# still evicts trunk's from the repo-wide 10 GB budget, and one writer per group
# means one cache per OS.
jobs:
  check:
    name: check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          save-if: false

      - name: check
        run: cargo check --workspace --features geotrace/self-update

  clippy:
    name: clippy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          save-if: false

      - name: Clippy
        run: |
          cargo clippy --workspace --no-deps -- -D warnings
          cargo clippy --workspace --no-deps --tests -- -D warnings
          cargo clippy --workspace --no-deps --examples -- -D warnings
          cargo clippy --workspace --no-deps --features geotrace/self-update --tests -- -D warnings

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      # Writer for the `app` group: the widest dependency set here.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: nextest,just

      # wgpu requires a GPU or a software renderer for headless test rendering.
      # Ubuntu GitHub runners have no GPU. Force Mesa's OpenGL software rasterizer.
      - name: Set up software GPU rendering (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=gl" >> "$GITHUB_ENV"

      - name: Tests
        run: cargo nextest run --workspace --features geotrace/self-update --profile ci

      # Linux and macOS both compare snapshots (Windows CI skips comparison,
      # see gt-test-utils::snapshot_harness), so upload diffs from both.
      - name: Upload snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os != 'windows-latest' && always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/tests/snapshots"

  test-backends:
    name: test-backends / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: nextest

      - name: Tests (pure backend)
        shell: bash
        run: |
          cargo nextest run -p gt-history --test integration --no-default-features --features backend-pure --profile ci
          cargo nextest run -p gt-store --test log_attachments --no-default-features --features backend-pure --profile ci

      - name: Tests (sys backend)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo nextest run -p gt-history --test integration --no-default-features --features backend-sys --profile ci
          cargo nextest run -p gt-store --test log_attachments --no-default-features --features backend-sys --profile ci

  examples:
    name: examples / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          save-if: false

      - name: Examples
        run: bash scripts/examples.sh

  quality:
    name: quality / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          save-if: false

      # `cbindgen` generates sdk/c/geotrace.h. Its version is pinned: another
      # release lays the header out differently, which reads as drift.
      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just,cbindgen@0.29.4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            scripts/qa/pyproject.toml
            scripts/qa/uv.lock

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Verify Cargo.lock is up to date
        run: cargo update --workspace --locked

      - name: QA lint
        run: just qa::qa-lint

      - name: QA tests
        run: just qa::test

      - name: QA checks
        run: |
          just qa::check-all
          just qa::check-versions

      - name: C header
        run: just check-c-header

      - name: Docs
        run: just doc

  vale:
    name: vale / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The gate diffs against the base ref, and lints every commit in the range.
          fetch-depth: 0

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            scripts/qa/pyproject.toml
            scripts/qa/uv.lock

      - name: Sync Vale packages
        run: just qa::vale-sync

      # A pull request is gated against its base. A push to trunk is a merged
      # pull request, gated against the commit before it.
      - name: Prose on added lines and commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: just qa::vale-added "$BASE"

  ci-essentials:
    runs-on: ubuntu-latest
    needs:
      - check
      - clippy
      - test
      - test-backends
      - examples
      - quality
      - vale
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
