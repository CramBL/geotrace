name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Run monthly on the 1st at 03:00 UTC to catch regressions from upstream deps.
    - cron: "0 3 1 * *"

# Minimal permissions - CI only reads the repository.
permissions:
  contents: read

# Cancel in-flight runs for the same PR on a new push. Never cancel default-branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: 
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      # cargo-pup is a compiler-plugin architecture linter that must be built
      # with the specific nightly version the workspace's pup.ron targets.
      # The gt-arch crate's test suite (part of the Tests step below) invokes
      # `cargo pup check` directly, so only the platform that runs that
      # package's tests needs this toolchain.
      - name: Install Rust nightly (for cargo-pup)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: nightly-2026-01-22
          components: rust-src,rustc-dev,llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: nextest,just

      - name: Install uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install cargo-pup
        if: runner.os == 'Linux'
        run: cargo +nightly-2026-01-22 install cargo_pup

      # wgpu requires a GPU or a software renderer for headless test rendering.
      # Ubuntu GitHub runners have no GPU. Force Mesa's OpenGL software rasteriser.
      - name: Set up software GPU rendering (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=gl" >> "$GITHUB_ENV"

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: check
        run: cargo check --workspace --features geotrace/self-update

      - name: Clippy
        run: |
          cargo clippy --workspace --no-deps -- -D warnings
          cargo clippy --workspace --no-deps --tests -- -D warnings
          cargo clippy --workspace --no-deps --examples -- -D warnings
          cargo clippy --workspace --no-deps --features geotrace/self-update --tests -- -D warnings

      - name: Tests
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --features geotrace/self-update --profile ci
        env:
          GEOTRACE_OFFLINE: 1

      # gt-arch's test invokes `cargo pup check`, which needs the nightly
      # toolchain installed only on Linux (see above) - exclude it elsewhere.
      - name: Tests (excluding gt-arch architecture check)
        if: runner.os != 'Linux'
        run: cargo nextest run --workspace --exclude gt-arch --features geotrace/self-update --profile ci
        env:
          GEOTRACE_OFFLINE: 1

      - name: Upload snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'macos-latest' && always()
        with:
          name: test-results
          path: "**/tests/snapshots"

      - name: Examples
        run: bash scripts/examples.sh

      - name: QA checks
        if: runner.os == 'Linux'
        run: |
          just qa::qa-lint
          just qa::check-all
          just qa::check-versions

  ci-essentials:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
