name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Run monthly on the 1st at 03:00 UTC to catch regressions from upstream deps.
    - cron: "0 3 1 * *"

# Minimal permissions - CI only reads the repository.
permissions:
  contents: read

# Cancel in-flight runs for the same PR on a new push. Never cancel default-branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: check
        run: cargo check --workspace --features geotrace/self-update

  clippy:
    name: clippy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Clippy
        run: |
          cargo clippy --workspace --no-deps -- -D warnings
          cargo clippy --workspace --no-deps --tests -- -D warnings
          cargo clippy --workspace --no-deps --examples -- -D warnings
          cargo clippy --workspace --no-deps --features geotrace/self-update --tests -- -D warnings

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: nextest,just

      # wgpu requires a GPU or a software renderer for headless test rendering.
      # Ubuntu GitHub runners have no GPU. Force Mesa's OpenGL software rasteriser.
      - name: Set up software GPU rendering (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=gl" >> "$GITHUB_ENV"

      # The `ci` profile excludes the gt-arch architecture check (see .config/nextest.toml)
      - name: Tests
        run: cargo nextest run --workspace --features geotrace/self-update --profile ci
        env:
          GEOTRACE_OFFLINE: 1

      # Linux and macOS both compare snapshots (Windows CI skips comparison,
      # see gt-test-utils::snapshot_harness), so upload diffs from both.
      - name: Upload snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os != 'windows-latest' && always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/tests/snapshots"

  examples:
    name: examples / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Examples
        run: bash scripts/examples.sh

  quality:
    name: quality / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            scripts/qa/pyproject.toml
            scripts/qa/uv.lock

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Verify Cargo.lock is up to date
        run: cargo update --workspace --locked

      - name: QA lint
        run: just qa::qa-lint

      - name: QA tests
        run: just qa::test

      - name: QA checks
        run: |
          just qa::check-all
          just qa::check-versions

      - name: Docs
        run: just doc

  # The gt-arch architecture check (cargo-pup) is slow and needs a pinned
  # nightly toolchain. The `arch` nextest profile selects only the
  # gt-arch package (see .config/nextest.toml).
  arch:
    name: Architecture lints (cargo-pup)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      # cargo-pup is a compiler-plugin architecture linter that must be built
      # with the specific nightly version expected by the gt-arch checks.
      - name: Install Rust nightly (for cargo-pup)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: nightly-2026-01-22
          components: rust-src,rustc-dev,llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: arch-ubuntu
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: nextest

      - name: Install cargo-pup
        run: cargo +nightly-2026-01-22 install cargo_pup

      - name: Architecture check
        run: cargo nextest run -p gt-arch --profile arch

  ci-essentials:
    runs-on: ubuntu-latest
    needs:
      - check
      - clippy
      - test
      - examples
      - quality
      - arch
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
