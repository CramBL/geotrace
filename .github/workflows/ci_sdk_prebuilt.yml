name: CI / SDK Prebuilt Libraries
# Demonstrates that the C SDK can be consumed WITHOUT the Rust toolchain: one
# job builds the library with Rust and uploads it as a CI artifact, and a
# separate job downloads only that artifact and builds + runs a C consumer
# against it — mirroring a real GitHub Releases pipeline.
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Use bash on every runner (Git Bash on Windows) so there is a single shell to
# read and maintain instead of a mix of bash and PowerShell.
defaults:
  run:
    shell: bash

jobs:
  build-shared:
    name: Build shared / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Shared-library demo targets Unix only: the Windows CMake setup defaults to
    # static linking (the standard Windows distribution story).  The static demo
    # below covers all three platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build geotrace-c (shared)
        run: cargo build -p geotrace-c --release

      - name: Install C SDK to local prefix
        run: |
          cmake -S sdk/c -B build/c \
            -DGEOTRACE_C_LIB_DIR=${{ github.workspace }}/target/release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          cmake --install build/c

      - name: Upload shared-library artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geotrace-c-shared-${{ matrix.os }}
          path: install/
          retention-days: 7

  consume-shared:
    name: Consume shared / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-shared

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Intentionally no Rust toolchain — this job proves that downstream
      # users can build against a prebuilt library without rustup.
      - name: Set up SDK toolchain
        uses: ./.github/actions/setup-sdk-toolchain
        with:
          compiler: llvm-20
          cmake: true

      - name: Download shared-library artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geotrace-c-shared-${{ matrix.os }}
          path: sdk-artifact

      - name: Configure prebuilt smoke consumer
        run: |
          cmake -S sdk/integration-tests/prebuilt -B build/smoke \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/sdk-artifact \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build prebuilt smoke consumer
        run: cmake --build build/smoke

      - name: Run prebuilt smoke consumer (proves no Rust toolchain needed)
        run: ctest --test-dir build/smoke --output-on-failure

  build-static:
    name: Build static / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: 
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build geotrace-c (static)
        run: cargo build -p geotrace-c --release

      - name: Install C SDK to local prefix (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S sdk/c -B build/c \
            -DGEOTRACE_C_LIB_DIR=${{ github.workspace }}/target/release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DGEOTRACE_C_STATIC=ON
          cmake --install build/c

      - name: Install C SDK to local prefix (Windows)
        if: runner.os == 'Windows'
        run: |
          # No explicit -G: CMake's default Visual Studio generator tracks the
          # runner image's installed VS version, so this survives VS bumps.
          cmake -S sdk/c -B build/c \
            -A x64 \
            -DGEOTRACE_C_LIB_DIR="${{ github.workspace }}/target/release" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DGEOTRACE_C_STATIC=ON
          cmake --install build/c --config Release

      - name: Upload static-library artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geotrace-c-static-${{ matrix.os }}
          path: install/
          retention-days: 7

  consume-static:
    name: Consume static / ${{ matrix.os }}${{ matrix.gen_label && format(' / {0}', matrix.gen_label) || '' }}
    runs-on: ${{ matrix.os }}
    needs: build-static

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # An empty generator selects CMake's default VS generator, which
          # tracks the runner image's VS version (avoids pinning "Visual Studio NN").
          - { os: windows-latest, generator: "", gen_label: MSBuild, cmake_extra_args: "-A x64" }
          - { os: windows-latest, generator: Ninja, gen_label: Ninja, cmake_extra_args: "-DCMAKE_BUILD_TYPE=Release" }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Intentionally no Rust toolchain — this job proves that downstream
      # users can build against a prebuilt library without rustup.
      # On Windows, cmake comes from the runner (which tracks the installed VS
      # version): setup-cpp's cmake is older and, with ninja, makes
      # CMAKE_GENERATOR default to Ninja, breaking the MSBuild "-A x64" path.
      - name: Set up SDK toolchain
        uses: ./.github/actions/setup-sdk-toolchain
        with:
          compiler: ${{ matrix.os == 'windows-latest' && 'msvc' || 'llvm-20' }}
          cmake: ${{ runner.os != 'Windows' }}
          ninja: true

      - name: Download static-library artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geotrace-c-static-${{ matrix.os }}
          path: sdk-artifact

      - name: Configure prebuilt smoke consumer (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S sdk/integration-tests/prebuilt -B build/smoke \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/sdk-artifact \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure prebuilt smoke consumer (Windows)
        if: runner.os == 'Windows'
        run: |
          # An empty matrix.generator selects CMake's default VS generator.
          # GEN/cmake_extra_args are unquoted on purpose so they word-split into
          # separate cmake arguments (e.g. "-A x64" -> two args).
          GEN=""
          [ -n "${{ matrix.generator }}" ] && GEN="-G ${{ matrix.generator }}"
          cmake -S sdk/integration-tests/prebuilt -B build/smoke \
            $GEN ${{ matrix.cmake_extra_args }} \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/sdk-artifact"

      - name: Build prebuilt smoke consumer
        run: cmake --build build/smoke --config Release

      - name: Run prebuilt smoke consumer (proves no Rust toolchain needed)
        if: runner.os != 'Windows'
        run: ctest --test-dir build/smoke --output-on-failure

      - name: Run prebuilt smoke consumer (Windows)
        if: runner.os == 'Windows'
        working-directory: build/smoke
        run: ctest -C Release --output-on-failure

  ci-sdk-prebuilt:
    runs-on: ubuntu-latest
    needs: [build-shared, consume-shared, build-static, consume-static]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
