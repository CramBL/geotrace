name: Release SDK

# The SDK releases on its own cadence, independent of the GUI app. Pushing a
# `geotrace-sdk-vX.Y.Z` tag builds the C/C++ archives, creates a GitHub release,
# and publishes to crates.io, PyPI, and the Homebrew tap. The GUI app uses bare
# `vX.Y.Z` tags and the separate dist-generated release.yml.
#
# A manual run (workflow_dispatch) only builds + uploads the archives as CI
# artifacts (a dry run); it never publishes.
on:
  push:
    tags:
      - 'geotrace-sdk-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

# Read-only by default; publish jobs elevate their own permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# One shell on every runner (Git Bash on Windows) so there is a single dialect
# to maintain, matching the rest of CI.
defaults:
  run:
    shell: bash

jobs:
  # Parse the tag into a version and decide whether this run publishes.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#geotrace-sdk-v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            # A hyphen in the version (e.g. 0.1.0-rc.1) marks a prerelease: the
            # GitHub release is flagged, and crates.io/PyPI publishing is skipped.
            case "$version" in
              *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  # Guard: the SDK version must be consistent across every manifest, and on a
  # real release it must equal the tag. Gates the release and all publishing,
  # so a forgotten version bump fails before anything is pushed to a registry.
  verify-versions:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just
      - name: Check SDK version consistency
        run: |
          set -euo pipefail
          if [ "${{ needs.meta.outputs.publish }}" = "true" ]; then
            just qa::check-versions --expect "${{ needs.meta.outputs.version }}"
          else
            just qa::check-versions
          fi

  # Build the relocatable C + C++ CMake install tree for each platform and
  # package it. Windows uses the native MSVC target (no mingw), mirroring the
  # static-build path proven in ci_sdk_prebuilt.yml.
  build-archives:
    name: archive / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, win_arch: x64 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, win_arch: ARM64 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      # The Git Bash coreutils link.exe shadows the MSVC linker on PATH; remove
      # it so cargo/cmake find the real one. No-op off Windows.
      - name: Remove Git Bash link.exe shim (Windows)
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe

      - name: Build geotrace-c (release, static)
        run: cargo build -p geotrace-c --release

      - name: Install C + C++ SDK to a prefix
        env:
          PREFIX: ${{ github.workspace }}/sdk-install
          LIB_DIR: ${{ github.workspace }}/target/release
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            # No explicit -G: CMake's default Visual Studio generator tracks the
            # runner image's VS version. -A selects the architecture.
            GEN_ARGS=(-A "${{ matrix.win_arch }}")
          else
            GEN_ARGS=()
          fi
          # C SDK (static; WIN32 forces static anyway). BUILD_TESTING=OFF keeps
          # configure from pulling test-only dependencies (e.g. Criterion).
          cmake -S sdk/c -B build/c \
            "${GEN_ARGS[@]}" \
            -DBUILD_TESTING=OFF \
            -DGEOTRACE_C_STATIC=ON \
            -DGEOTRACE_C_LIB_DIR="$LIB_DIR" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --install build/c --config Release
          # C++ SDK (header-only) into the same prefix; finds the C package there.
          cmake -S sdk/cpp -B build/cpp \
            "${GEN_ARGS[@]}" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --install build/cpp --config Release

      - name: Package archive
        id: package
        env:
          PREFIX: ${{ github.workspace }}/sdk-install
        run: |
          set -euo pipefail
          name="geotrace-sdk-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="$name.zip"
            ( cd "$PREFIX" && 7z a -tzip "$GITHUB_WORKSPACE/$archive" . >/dev/null )
            certutil -hashfile "$archive" SHA256 | sed -n '2p' | tr -d ' \r' > "$archive.sha256"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" -C "$PREFIX" .
            shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-archive-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # Create the GitHub release for the tag and attach every archive + checksum.
  github-release:
    needs: [meta, verify-versions, build-archives, build-wheels, build-sdist]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download C/C++ archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sdk-archive-*
          path: archives
          merge-multiple: true

      # A prerelease skips PyPI, so the built wheels are attached to the release
      # instead; the Python smoke test installs them with `pip --find-links`.
      - name: Download Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: python-dist
          merge-multiple: true

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          assets=(archives/*)
          # Attach wheels only on a prerelease; on a stable release they go to PyPI.
          if [ "$IS_PRERELEASE" = "true" ]; then
            assets+=(python-dist/*.whl)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GeoTrace SDK ${{ needs.meta.outputs.version }}" \
            --notes "C, C++, Rust, and Python SDK release ${{ needs.meta.outputs.version }}." \
            $PRERELEASE \
            "${assets[@]}"

  # Publish the Rust SDK crates to crates.io, in dependency order.
  publish-crates:
    needs: [meta, verify-versions]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # crates.io publishes are irreversible, so make this re-runnable: skip
          # any crate whose version is already on the index (a re-run after a
          # later job failed must not error on "crate already exists").
          publish() {
            if curl -fsS "https://crates.io/api/v1/crates/$1/$VERSION" >/dev/null 2>&1; then
              echo "$1 $VERSION already on crates.io, skipping"
            else
              cargo publish -p "$1"
            fi
          }
          publish geotrace-sdk-macros
          # `cargo publish` waits for the new crate to appear in the index, so
          # geotrace-sdk can resolve the macro crate published just above.
          publish geotrace-sdk

  # Build wheels for the Python SDK across platforms and interpreters.
  build-wheels:
    name: wheels / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, manylinux: auto }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, manylinux: auto }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # On macOS/Windows --find-interpreter discovers these; inside the Linux
      # manylinux container maturin uses the container's own CPythons instead.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
            3.12
            3.13
            3.14

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: sdk/python/geotrace-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist --find-interpreter

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: sdk/python/geotrace-py/dist/*
          retention-days: 7

  # Build the source distribution once.
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: sdk/python/geotrace-py
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: sdk/python/geotrace-py/dist/*
          retention-days: 7

  # Publish the Python SDK to PyPI using Trusted Publishing (OIDC, no token).
  # Requires the PyPI project to be configured with this repo + workflow as a
  # trusted publisher.
  publish-pypi:
    needs: [meta, verify-versions, build-wheels, build-sdist]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
          # Re-runnable: don't fail if some files are already on PyPI.
          skip-existing: true

  # Refresh the C/C++ SDK library formula in the Homebrew tap from this release's
  # archives. dist's built-in homebrew job only generates the GUI app formula, so
  # this library formula is maintained here.
  publish-homebrew:
    needs: [meta, github-release]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Render and push the formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          dl() {
            # Read the published .sha256 sidecar for a target's archive.
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "geotrace-sdk-$1.tar.gz.sha256" --output - --clobber
          }
          mac_arm="$(dl aarch64-apple-darwin)"
          mac_x86="$(dl x86_64-apple-darwin)"
          lin_arm="$(dl aarch64-unknown-linux-gnu)"
          lin_x86="$(dl x86_64-unknown-linux-gnu)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/CramBL/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/geotrace-c.rb <<EOF
          class GeotraceC < Formula
            desc "C/C++ SDK for the GeoTrace .gtd navigation data format"
            homepage "https://github.com/CramBL/geotrace"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/geotrace-sdk-aarch64-apple-darwin.tar.gz"
                sha256 "${mac_arm}"
              end
              on_intel do
                url "${base}/geotrace-sdk-x86_64-apple-darwin.tar.gz"
                sha256 "${mac_x86}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/geotrace-sdk-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${lin_arm}"
              end
              on_intel do
                url "${base}/geotrace-sdk-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${lin_x86}"
              end
            end

            def install
              prefix.install Dir["*"]
            end

            test do
              assert_predicate include/"geotrace.h", :exist?
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/geotrace-c.rb
          # Re-runnable: only commit when the formula actually changed.
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}, nothing to push"
          else
            git commit -m "geotrace-c ${VERSION}"
            git push
          fi
