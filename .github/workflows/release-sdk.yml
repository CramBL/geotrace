name: Release SDK

# Independent of the GUI app: pushing a `geotrace-sdk-vX.Y.Z` tag builds the
# C/C++ archives and Python wheels, creates a GitHub release, and publishes to
# crates.io, PyPI, and the Homebrew tap. A workflow_dispatch run is a no-publish
# dry run.
on:
  push:
    tags:
      - "geotrace-sdk-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  # Parse the tag into a version and decide whether this run publishes.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#geotrace-sdk-v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            # A hyphen (e.g. 0.1.0-rc.1) marks a prerelease.
            case "$version" in
              *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  # Fail the release if the SDK version is inconsistent across manifests, or (on
  # a real release) not equal to the tag.
  verify-versions:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just
      - name: Check SDK version consistency
        env:
          PUBLISH: ${{ needs.meta.outputs.publish }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            just qa::check-versions --expect "$VERSION"
          else
            just qa::check-versions
          fi

  # Build and package the relocatable C & C++ CMake install tree per platform.
  build-archives:
    name: archive / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - {
              target: x86_64-pc-windows-msvc,
              runner: windows-latest,
              win_arch: x64,
            }
          - {
              target: aarch64-pc-windows-msvc,
              runner: windows-11-arm,
              win_arch: ARM64,
            }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      # Restore-only: a tag builds once, so writing here would only evict trunk's
      # caches. zizmor flags any cache action in a release workflow and does not
      # read save-if, hence the ignore.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          key: ${{ matrix.target }}
          save-if: false

      - name: Remove Git Bash link.exe shim (Windows)
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe

      - name: Build geotrace-c (release, static)
        run: cargo build -p geotrace-c --release

      - name: Install C & C++ SDK to a prefix
        env:
          PREFIX: ${{ github.workspace }}/sdk-install
          LIB_DIR: ${{ github.workspace }}/target/release
        run: |
          set -euo pipefail
          GEN_ARGS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            GEN_ARGS="-A ${{ matrix.win_arch }}"
          fi
          # C SDK (static)
          cmake -S sdk/c -B build/c \
            $GEN_ARGS \
            -DBUILD_TESTING=OFF \
            -DGEOTRACE_C_STATIC=ON \
            -DGEOTRACE_C_LIB_DIR="$LIB_DIR" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --install build/c --config Release
          # C++ SDK (header-only)
          cmake -S sdk/cpp -B build/cpp \
            $GEN_ARGS \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --install build/cpp --config Release

      - name: Package archive
        id: package
        env:
          PREFIX: ${{ github.workspace }}/sdk-install
        run: |
          set -euo pipefail
          name="geotrace-sdk-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="$name.zip"
            ( cd "$PREFIX" && 7z a -tzip "$GITHUB_WORKSPACE/$archive" . >/dev/null )
            certutil -hashfile "$archive" SHA256 | sed -n '2p' | tr -d ' \r' > "$archive.sha256"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" -C "$PREFIX" .
            shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-archive-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 7

  # Create the GitHub release for the tag and attach every archive + checksum.
  github-release:
    needs:
      - meta
      - verify-versions
      - build-archives
      - wheels-linux
      - wheels-musllinux
      - wheels-windows
      - wheels-macos
      - build-sdist
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download C/C++ archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sdk-archive-*
          path: archives
          merge-multiple: true

      # On a prerelease the wheels are attached to the release (PyPI is skipped).
      - name: Download Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: python-dist
          merge-multiple: true

      - name: Create release and upload artifacts
        env:
          # Repo-scoped PAT, not GITHUB_TOKEN: only a PAT-created release emits the
          # `release: published` event that triggers release-smoke.yml.
          GH_TOKEN: ${{ secrets.GEOTRACE_WITH_REPO_SCOPE }}
          IS_PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease == 'true' && '--prerelease' || '' }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          assets=(archives/*)
          if [ "$IS_PRERELEASE" = "true" ]; then
            assets+=(python-dist/*.whl)
          fi
          # Release body: the CHANGELOG_SDK.md section for this version. A
          # prerelease (0.2.0-rc.1) shares the base version's (0.2.0) notes.
          core="${VERSION%%-*}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v ver="$core" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG_SDK.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "C, C++, Rust, and Python SDK release $VERSION." > "$notes"
          fi
          # Idempotent re-runs: delete any existing release first so `gh release
          # create` does not error on the tag. Recreating via the PAT re-emits
          # `release: published`, re-running the smoke tests. The git tag stays
          # (no --cleanup-tag).
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GeoTrace SDK $VERSION" \
            --notes-file "$notes" \
            --latest=false \
            $PRERELEASE \
            "${assets[@]}"

  # Publish the Rust SDK crates to crates.io, in dependency order.
  publish-crates:
    needs:
      - meta
      - verify-versions
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Publish crates # zizmor: ignore[use-trusted-publishing]
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_GEOTRACE_PUBLISH }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Skip crates already on the index so a re-run after a later failure
          # doesn't error on "crate already exists". crates.io returns 403
          # without a User-Agent, so send one or the check always misses.
          publish() {
            if curl -fsS -A "geotrace-release (+https://github.com/CramBL/geotrace)" "https://crates.io/api/v1/crates/$1/$VERSION" >/dev/null 2>&1; then
              echo "$1 $VERSION already on crates.io, skipping"
            else
              cargo publish -p "$1"
            fi
          }
          publish geotrace-sdk-macros
          publish geotrace-sdk-units
          publish geotrace-sdk

  # Build the Python wheels, one job per OS family.
  wheels-linux:
    name: wheels / linux / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64 }
          - { runner: ubuntu-22.04, target: x86 }
          - { runner: ubuntu-22.04, target: aarch64 }
          - { runner: ubuntu-22.04, target: armv7 }
          - { runner: ubuntu-22.04, target: s390x }
          - { runner: ubuntu-22.04, target: ppc64le }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: sdk/python/geotrace-py
          target: ${{ matrix.platform.target }}
          manylinux: auto
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: sdk/python/geotrace-py/dist/*
          retention-days: 7

  wheels-musllinux:
    name: wheels / musllinux / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64 }
          - { runner: ubuntu-22.04, target: x86 }
          - { runner: ubuntu-22.04, target: aarch64 }
          - { runner: ubuntu-22.04, target: armv7 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: sdk/python/geotrace-py
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: sdk/python/geotrace-py/dist/*
          retention-days: 7

  wheels-windows:
    name: wheels / windows / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-latest, target: x64, python_arch: x64 }
          - { runner: windows-latest, target: x86, python_arch: x86 }
          - { runner: windows-11-arm, target: aarch64, python_arch: arm64 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: sdk/python/geotrace-py
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: sdk/python/geotrace-py/dist/*
          retention-days: 7

  wheels-macos:
    name: wheels / macos / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: sdk/python/geotrace-py
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: sdk/python/geotrace-py/dist/*
          retention-days: 7

  # Build the source distribution once.
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: sdk/python/geotrace-py
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: sdk/python/geotrace-py/dist/*
          retention-days: 7

  # Publish wheels + sdist to PyPI via Trusted Publishing (OIDC, no token).
  publish-pypi:
    needs:
      - meta
      - verify-versions
      - wheels-linux
      - wheels-musllinux
      - wheels-windows
      - wheels-macos
      - build-sdist
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
          skip-existing: true

  # Refresh the C/C++ SDK library formula in the Homebrew tap from this release.
  publish-homebrew:
    needs:
      - meta
      - github-release
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Render and push the formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          dl() {
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "geotrace-sdk-$1.tar.gz.sha256" --output - --clobber
          }
          mac_arm="$(dl aarch64-apple-darwin)"
          mac_x86="$(dl x86_64-apple-darwin)"
          lin_arm="$(dl aarch64-unknown-linux-gnu)"
          lin_x86="$(dl x86_64-unknown-linux-gnu)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/CramBL/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/geotrace-c.rb <<EOF
          class GeotraceC < Formula
            desc "C/C++ SDK for the GeoTrace .gtd navigation data format"
            homepage "https://github.com/CramBL/geotrace"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/geotrace-sdk-aarch64-apple-darwin.tar.gz"
                sha256 "${mac_arm}"
              end
              on_intel do
                url "${base}/geotrace-sdk-x86_64-apple-darwin.tar.gz"
                sha256 "${mac_x86}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/geotrace-sdk-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${lin_arm}"
              end
              on_intel do
                url "${base}/geotrace-sdk-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${lin_x86}"
              end
            end

            def install
              prefix.install Dir["*"]
            end

            test do
              assert_predicate include/"geotrace.h", :exist?
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/geotrace-c.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}, nothing to push"
          else
            git commit -m "geotrace-c ${VERSION}"
            git push
          fi
