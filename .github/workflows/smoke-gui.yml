name: Smoke / GUI

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      prerelease:
        required: true
        type: string

permissions:
  contents: read

env:
  REPO: CramBL/geotrace
  TAP: CramBL/homebrew-tap
  VERSION: ${{ inputs.version }}

defaults:
  run:
    shell: bash

jobs:
  shell-installer:
    name: shell / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      # The Linux runtime libraries the binary's loader resolves at launch. macOS
      # ships the equivalents in its system frameworks.
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxkbcommon0 libwayland-client0 libx11-6 libxcursor1 libxi6 libxrandr2 libxcb1

      - name: Install GeoTrace via the shell installer
        env:
          TAG: ${{ inputs.tag }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/${REPO}/releases/download/${TAG}/geotrace-installer.sh" | sh
          # Put the install dir on PATH for the next step.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify installed binary
        run: &verify-unix-binary |
          set -euo pipefail
          desktop="${GEOTRACE_EXE:-$(command -v geotrace)}"
          desktop_version="$("$desktop" --version)"
          printf '%s\n' "$desktop_version"
          if [[ "$desktop_version" != "geotrace $VERSION" ]]; then
            printf 'Expected geotrace %s from %s\n' "$VERSION" "$desktop" >&2
            exit 1
          fi
          init_request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'
          initialized='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          mcp_reply="$(printf '%s\n%s\n' "$init_request" "$initialized" | "$desktop" mcp)"
          mcp_server="$(printf '%s\n' "$mcp_reply" | jq -r '[.result.serverInfo.name, .result.serverInfo.version] | join(" ")')"
          printf '%s\n' "$mcp_server"
          if [[ "$mcp_server" != "geotrace $VERSION" ]]; then
            printf 'Expected MCP server geotrace %s from %s\n' "$VERSION" "$desktop" >&2
            exit 1
          fi

  powershell-installer:
    name: powershell / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    steps:
      - name: Install GeoTrace via the PowerShell installer
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/$env:REPO/releases/download/$env:TAG/geotrace-installer.ps1"
          irm $url | iex
          # Refresh PATH from the registry and expose the install dir to the next step.
          $env:Path = [Environment]::GetEnvironmentVariable("Path","User") + ";" + `
                      [Environment]::GetEnvironmentVariable("Path","Machine")
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path (Get-Command geotrace).Source)

      - name: Verify installed binary
        shell: pwsh
        run: &verify-windows-binary |
          $ErrorActionPreference = "Stop"
          $exe = (Get-Command geotrace.exe -CommandType Application).Source
          $desktopVersion = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "geotrace --version exited $LASTEXITCODE" }
          Write-Output $desktopVersion
          if ($desktopVersion -isnot [string] -or $desktopVersion -cne "geotrace $env:VERSION") {
            throw "Expected geotrace $env:VERSION from $exe"
          }
          $psi = [System.Diagnostics.ProcessStartInfo]::new($exe, "mcp")
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.StandardInputEncoding = [System.Text.UTF8Encoding]::new($false)
          $psi.StandardOutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $process = [System.Diagnostics.Process]::Start($psi)
          try {
            $initRequest = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'
            $initialized = '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            $process.StandardInput.Write("$initRequest`n$initialized`n")
            $process.StandardInput.Flush()
            $process.StandardInput.Close()
            $replyLine = $process.StandardOutput.ReadLine()
            if (-not $process.WaitForExit(10000)) {
              $process.Kill()
              throw "geotrace mcp did not exit after stdin closed"
            }
            if ($process.ExitCode -ne 0) { throw "geotrace mcp exited $($process.ExitCode)" }
          } finally {
            $process.Dispose()
          }
          if ([string]::IsNullOrWhiteSpace($replyLine)) {
            throw "geotrace mcp returned no initialize reply"
          }
          $reply = $replyLine | ConvertFrom-Json
          $serverInfo = $reply.result.serverInfo
          $mcpServer = "$($serverInfo.name) $($serverInfo.version)"
          Write-Output $mcpServer
          if ($mcpServer -cne "geotrace $env:VERSION") {
            throw "Expected MCP server geotrace $env:VERSION from $exe"
          }

  msi:
    name: msi / windows
    runs-on: windows-latest
    env:
      MSI: geotrace-x86_64-pc-windows-msvc.msi
    steps:
      - name: Download the MSI
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/$env:REPO/releases/download/$env:TAG/$env:MSI"
          Invoke-WebRequest -Uri $url -OutFile $env:MSI

      - name: Install it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$env:MSI`" /quiet /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited $($p.ExitCode)" }
          # Refresh PATH from the registry and expose the install dir to the next step.
          $env:Path = [Environment]::GetEnvironmentVariable("Path","User") + ";" + `
                      [Environment]::GetEnvironmentVariable("Path","Machine")
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path (Get-Command geotrace).Source)

      - name: Verify installed binary
        shell: pwsh
        run: *verify-windows-binary

  homebrew:
    name: brew / ${{ matrix.runner }}
    # The Homebrew formula is only published for stable releases.
    if: inputs.prerelease == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15-intel, macos-15]
    steps:
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libxkbcommon0 \
            libwayland-client0 \
            libx11-6 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            libxcb1

      # GitHub's macOS runners ship Homebrew, but the Linux runners do not, so
      # install Linuxbrew the way the Homebrew docs prescribe and put it on PATH
      # for the remaining steps.
      - name: Install Homebrew
        if: runner.os == 'Linux'
        run: |
          NONINTERACTIVE=1 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install GeoTrace with Homebrew
        run: |
          brew install "${TAP}/geotrace"
          echo "GEOTRACE_EXE=$(brew --prefix "${TAP}/geotrace")/bin/geotrace" >> "$GITHUB_ENV"

      - name: Verify installed binary
        run: *verify-unix-binary

  # Prove an existing install can pick up this release: install the previous
  # stable version (writing an install receipt), run its `geotrace --update`,
  # and confirm it replaced the binary with the version under test. This drives
  # the same axoupdater path the GUI prompt does, headlessly. Only the shell
  # installer writes a self-updatable receipt, so this mirrors that path.
  #
  # The flow is driven by the *previous* release's binary, so it can only run
  # once that binary understands `--update` - older ones take it for a file path
  # and try to open a window, which fails on a headless runner.
  self-update:
    name: self-update / ${{ matrix.runner }}
    # A prerelease isn't what existing stable installs update to, and it has no
    # meaningful "previous stable to update from" flow.
    if: inputs.prerelease == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    # Authenticate the release query to dodge unauthenticated rate limits.
    env:
      GH_TOKEN: ${{ github.token }}
      # The first release whose binary has the `--update` flag. Updating from
      # anything older cannot be driven headlessly, so the job skips instead.
      MIN_UPDATE_FLAG_VERSION: "0.10.0"
    steps:
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxkbcommon0 libwayland-client0 libx11-6 libxcursor1 libxi6 libxrandr2 libxcb1

      - name: Resolve the stable release before this one
        id: prev
        run: |
          set -euo pipefail
          versions="$(gh api "repos/${REPO}/releases" --paginate \
            --jq '.[] | select(.prerelease == false) | select(.tag_name | startswith("app/v")) | .tag_name' \
            | sed 's#^app/v##' | sort -V -u)"
          # The version immediately below the one just published.
          previous="$(printf '%s\n' "$versions" | grep -B1 -x "$VERSION" | head -1 || true)"
          if [ -z "$previous" ] || [ "$previous" = "$VERSION" ]; then
            echo "No earlier stable release than ${VERSION} - nothing to update from, skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `sort -V` puts the lower version first, so the minimum staying on top
          # means the previous release predates the flag.
          oldest="$(printf '%s\n%s\n' "$previous" "$MIN_UPDATE_FLAG_VERSION" | sort -V | head -1)"
          if [ "$oldest" = "$previous" ] && [ "$previous" != "$MIN_UPDATE_FLAG_VERSION" ]; then
            echo "app/v${previous} predates the --update flag (added in ${MIN_UPDATE_FLAG_VERSION}), skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Will install app/v${previous} and update to ${VERSION}."
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - name: Install the previous release
        if: steps.prev.outputs.skip == 'false'
        env:
          PREV_TAG: app/v${{ steps.prev.outputs.previous }}
          INSTALLER_NO_MODIFY_PATH: "1"
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/${REPO}/releases/download/${PREV_TAG}/geotrace-installer.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Update in place to the release under test
        if: steps.prev.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          desktop="$(command -v geotrace)"
          "$desktop" --update
          echo "GEOTRACE_EXE=$desktop" >> "$GITHUB_ENV"

      - name: Verify updated binary
        if: steps.prev.outputs.skip == 'false'
        run: *verify-unix-binary
