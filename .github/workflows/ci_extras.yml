name: CI / Extras

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  IN_GEOTRACE_CONTAINER: "1"

jobs:
  extras:
    name: Extras
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: app
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          # lychee has no install-action manifest: the cargo-binstall
          # fallback installs it from its own GitHub release.
          tool: just,typos,cargo-sort,cargo-shear,cargo-msrv,zizmor,lychee

      - name: Check dependency sort order
        run: just sort-check

      - name: Check unused dependencies
        run: just shear

      - name: Spell-check (typos)
        run: just typos

      - name: Check MSRV
        run: just msrv

      - name: Check links (lychee)
        run: just lychee

      - name: Vulnerability scan (osv-scanner)
        run: just osv-scanner

      - name: Lint workflows (zizmor)
        run: zizmor .

  ci-extras:
    runs-on: ubuntu-latest
    needs: [extras]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
