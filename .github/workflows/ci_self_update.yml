name: CI / Self-update

# Regression guard for the in-app updater. tests/self_update.rs installs the
# built binary with a fake "very old" receipt and drives `geotrace --update`,
# asserting axoupdater downloads the latest release and replaces the binary. It
# needs the network and the `self-update` feature, so it never runs on a normal
# `cargo test`; here we opt in with GEOTRACE_RUN_UPDATE_TEST and authenticate the
# release query with the automatic token to dodge rate limits.
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  self-update:
    name: self-update / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Runtime libraries the binary's loader resolves at launch, even for
      # `--update`/`--version` which open no window. macOS ships the equivalents.
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxkbcommon0 libwayland-client0 libx11-6 libxcursor1 libxi6 libxrandr2 libxcb1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Run the self-updater test
        env:
          GEOTRACE_RUN_UPDATE_TEST: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo test --features self-update --test self_update -- --nocapture

  ci-self-update:
    runs-on: ubuntu-latest
    needs: [self-update]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if the self-update check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
