name: CI / Cross

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect SDK changes
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.decide.outputs.sdk }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Filter SDK paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            sdk:
              - 'sdk/rust/geotrace-sdk/**'
              - 'sdk/rust/geotrace-sdk-macros/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tests/fixtures/gold_dataset/**'
              - '.github/workflows/ci_cross.yml'

      - name: Decide whether to run the SDK cross suite
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SDK_CHANGED: ${{ steps.filter.outputs.sdk }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Non-PR event ($EVENT_NAME): running the SDK cross suite."
            echo "sdk=true" >> "$GITHUB_OUTPUT"
          else
            echo "sdk=$SDK_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  # Run the SDK test suite (including large_file_round_trip) under QEMU on 32-bit ARM.
  # This catches pointer-size and integer-overflow bugs that are invisible on 64-bit hosts.
  cross-32bit:
    name: SDK / QEMU armv7 (32-bit)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sdk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
          cache-on-failure: true

      - name: Install cross
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cross

      - name: Run SDK tests under QEMU (32-bit ARM)
        run: cross test -p geotrace-sdk --target armv7-unknown-linux-gnueabihf

  ci-cross:
    runs-on: ubuntu-latest
    needs: [changes, cross-32bit]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Verify the SDK cross suite succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SDK_CHANGED: ${{ needs.changes.outputs.sdk }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The 'changes' detection job did not succeed (result: $CHANGES_RESULT)."
            exit 1
          fi
          if [ "$SDK_CHANGED" != "true" ]; then
            echo "No SDK changes detected; the SDK cross suite was intentionally skipped. OK."
            exit 0
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A dependency did not succeed (results: $RESULTS)."
              exit 1
            fi
          done
          echo "All SDK cross jobs succeeded."
