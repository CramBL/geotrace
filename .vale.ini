StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/Slop.zip
Vocab = GeoTrace

# Code comments are parsed as Markdown: inline code and fences are skipped.
# `.commit` is the format for a commit message on stdin (--ext=.commit).
[formats]
commit = md
rs = md
py = md
c = md
h = md
cpp = md
hpp = md

[*]
BasedOnStyles = Vale, Slop, GeoTrace
# GeoTrace.Spelling is Vale.Spelling with a filter for possessives.
Vale.Spelling = NO
# Vale.Terms enforces the vocabulary's casing, which flags crate names in headings.
Vale.Terms = NO
# Forked into GeoTrace with project exceptions.
Slop.Anthropomorphism = NO
Slop.Overused = NO
Slop.NegativeParallelism = NO
# GeoTrace.Dash covers it.
Slop.EmDash = NO
# Every rule reports as an error: a warning is a permission to ignore it.
Slop.Assistant = error
Slop.Ceremony = error
Slop.EmptyQualifiers = error
Slop.Headers = error
Slop.Hedging = error
Slop.Metaphor = error
Slop.RestatesCode = error
Slop.SelfPraise = error
Slop.Transitions = error
Slop.Tricolon = error
Slop.VagueReasons = error
Slop.Vocabulary = error
# Commit-only rules.
GeoTrace.CommitTrailer = NO
GeoTrace.CommitSubject = NO
GeoTrace.CommitSubjectLength = NO

# A Doxygen command names an identifier: `@p idx`, `@param idx`, `@ref
# GtdChannel`. Vale reads that name as prose, so the spell checker reports every
# parameter and field the C API documents. Only the name is skipped, never the
# text after it.
[*.{c,h,cpp,hpp,rs}]
TokenIgnores = (@(?:param|ref|p)\s+\S+)
# A Doxygen `@code` block is a source listing, not prose.
BlockIgnores = (?s) *@code.*?@endcode

[*.commit]
GeoTrace.CommitTrailer = YES
GeoTrace.CommitSubject = YES
GeoTrace.CommitSubjectLength = YES
# A lowercase namespace prefix ("ci: ...") is not a word to spell-check.
TokenIgnores = (\A[a-z]+:)

# The vocabulary table lists the words it forbids.
[CODE_STYLE.md]
GeoTrace.Vocabulary = NO

# The example models a user's trip. The application shows tracks.
[sdk/rust/geotrace-sdk/examples/demo_trip.rs]
GeoTrace.Vocabulary = NO
