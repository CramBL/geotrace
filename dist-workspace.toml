[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["msi"]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# A GitHub repo to push Homebrew formulas to
tap = "CramBL/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Features to pass to cargo build
features = ["dist"]
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Whether to enable GitHub Attestations
github-attestations = true
# A prefix git tags must include for dist to care about them
tag-namespace = "app"
github-build-setup = "../dist/build-setup.yml"

# Use native ARM runners instead of cross/QEMU for the aarch64 targets.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-pc-windows-msvc = "windows-11-arm"

# Pin the actions dist emits to the same commit SHAs the rest of CI pins.
[dist.github-action-commits]
"actions/checkout" = "de0fac2e4500dabe0009e67214ff5f5447ce83dd"               # v6.0.2
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"         # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"       # v8.0.1
"actions/attest" = "59d89421af93a897026c735860bf21b6eb4f7b26"                  # v4.1.0

# TODO(signing): GeoTrace currently ships UNSIGNED. Users will hit Gatekeeper
# (macOS) and SmartScreen (Windows) warnings on first launch (documented in the
# README). To sign later, obtain certificates and enable dist's signing config
# plus the corresponding GitHub secrets:
#   macOS (Developer ID + notarization):
#     APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#     APPLE_TEAM_ID, APPLE_ID, APPLE_PASSWORD (notarytool app-specific password)
#   Windows (Authenticode, e.g. SSL.com or Azure Trusted Signing):
#     the relevant signing cert/secret for dist's windows signing.
