[package]
name = "geotrace"
version.workspace = true
description.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The GUI app ships as prebuilt binaries via dist, never to crates.io (it also
# has path dependencies, which can't be published). exclude keeps
# dev/release-only files out of any `cargo package`.
publish = false
exclude = [".github", "RELEASES.md", "dist-workspace.toml", "scripts", "tests", "wix"]
homepage.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

# publish = false (above) hides this package from dist by default. Opt the binary
# back in so dist still builds and releases the GUI app.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "C0EAD23B-6B78-4C08-A4C4-2AF5EF829B92"
path-guid = "746A35A9-07E9-463D-9C4C-6A2A5E7A24F0"
license = false
eula = false

[workspace]
members = [
    "crates/gt-analysis",
    "crates/gt-arch",
    "crates/gt-egui-mipmap",
    "crates/gt-filter",
    "crates/gt-fmt",
    "crates/gt-geo-math",
    "crates/gt-history",
    "crates/gt-history-backend-pure",
    "crates/gt-history-backend-sys",
    "crates/gt-history-types",
    "crates/gt-icon-tessellate",
    "crates/gt-jam",
    "crates/gt-jam-store",
    "crates/gt-loaded-files",
    "crates/gt-loader",
    "crates/gt-logfile",
    "crates/gt-map",
    "crates/gt-plot",
    "crates/gt-query",
    "crates/gt-side-panel",
    "crates/gt-sky",
    "crates/gt-snap",
    "crates/gt-test-utils",
    "crates/gt-track-builder",
    "crates/gt-types",
    "crates/gt-ui-theme",
    "crates/gt-ui-types",
    "sdk/rust/geotrace-c",
    "sdk/rust/geotrace-sdk",
    "sdk/rust/geotrace-sdk-macros",
    "sdk/rust/geotrace-sdk-units",
]

[workspace.package]
description = "High-performance GNSS data visualizer, with advanced debugging and anomaly detection capabitilies"
version = "0.10.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
authors = ["Marc Beck König <mgit@tuta.io>"]
homepage = "https://github.com/CramBL/geotrace"
repository = "https://github.com/CramBL/geotrace"
readme = "README.md"

[workspace.dependencies]
bon = "3"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4.44", default-features = false, features = ["std", "now", "clock", "oldtime"] }
criterion = "0.8"
dirs = "6"
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "wgpu", "wayland"] }
egui = "0.34.3"
egui-phosphor = "0.12.0"
egui-wgpu = "0.34.3"
egui_extras = "0.34.3"
egui_kittest = { version = "0.34.3", features = ["eframe", "wgpu", "snapshot"] }
egui_plot = "0.35.0"
egui_tiles = "0.15"
env_logger = "0.11.10"
geo = "0.33.1"
geo-types = "0.7.19"
# H3 cell indices, the addressing scheme the interference datasets are
# published in. Pure Rust, no C bindings; the `geo` feature is not needed
# because gt-jam only parses indices and asks for their boundaries.
h3o = "0.10"
# `static` builds the bundled libhdf5 rather than looking for a system one, so
# it belongs to every consumer: gt-history's dev-dependency reaches hdf5-metno
# even when gt-history-backend-sys is compiled out, and without it that build
# falls back to pkg-config and fails wherever libhdf5 is not installed.
hdf5 = { package = "hdf5-metno", version = "0.14", features = ["static", "zlib"] }
hdf5-pure = "0.28"
insta = "1.48.0"
log = "0.4"
logos = "0.16"
nalgebra = "0.35"
parking_lot = "0.12"
polyline = "0.11"
postcard = { version = "1", default-features = false, features = ["alloc"] }
proc-macro2 = "1"
proptest = "1"
quote = "1"
rayon = "1"
# `gzip` is not optional for gt-jam: gpsjam.org serves its datasets
# gzip-encoded whether or not the client advertises support, so without
# transparent decoding the body arrives as compressed bytes.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "json", "rustls"] }
rstar = "0.13"
rstest = "0.26"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["union"] }
strum = { version = "0.28", features = ["derive"] }
syn = "2"
tempfile = "3"
test-log = "0.2"
thiserror = "2"
uom = "0.38.0"
uuid = { version = "1", features = ["v4"] }
vec1 = "1"
walkers = "0.53.0"

[workspace.lints.rust]
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
variant_size_differences = "warn"
unexpected_cfgs = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
cognitive_complexity = { level = "warn", priority = -1 }
disallowed_macros = "warn"                   # See clippy.toml
disallowed_methods = "warn"                  # See clippy.toml
disallowed_names = "warn"                    # See clippy.toml
disallowed_script_idents = "warn"            # See clippy.toml
disallowed_types = "warn"                    # See clippy.toml
indexing_slicing = "warn"
as_ptr_cast_mut = "warn"
await_holding_lock = "warn"
bool_to_int_with_if = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
fn_to_numeric_cast_any = "warn"
from_iter_instead_of_collect = "warn"
get_unwrap = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
into_iter_without_iter = "warn"
invalid_upcast_comparisons = "warn"
iter_not_returning_iterator = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_without_into_iter = "warn"
large_digit_groups = "warn"
large_include_file = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_instant_elapsed = "warn"
manual_is_power_of_two = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mismatching_type_param_order = "warn"
missing_enforced_import_renames = "warn"
missing_safety_doc = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_range_loop = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"

string_slice = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
unchecked_time_subtraction = "warn"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
assertions_on_result_states = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
float_cmp = "warn"
cast_sign_loss = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
missing_fields_in_debug = "warn"
format_push_string = "warn"
ref_option = "warn"
needless_raw_string_hashes = "warn"
ignored_unit_patterns = "warn"

[features]
default = []
# Enabled by dist for the distributed prebuilt binaries (see dist-workspace.toml).
# Umbrella for everything that should only ship in those builds.
dist = ["self-update"]
# In-app update check and self-update via axoupdater. Off by default so builds
# from source or via package managers (e.g. `cargo install`) carry no updater
# code. dist turns it on for the release binaries.
self-update = ["dep:axoupdater"]

[dependencies]
# Used as a library (not a standalone updater binary) for the startup update
# check, behind the `self-update` feature. Driven via its async API on a small
# tokio runtime (see src/app/update.rs).
axoupdater = { version = "0.10", optional = true }
chrono.workspace = true
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
egui-notify = "0.22"
egui-phosphor.workspace = true
egui_extras.workspace = true
egui_tiles.workspace = true
env_logger.workspace = true
geotrace-sdk-units = { path = "sdk/rust/geotrace-sdk-units" }
gt-analysis = { path = "crates/gt-analysis" }
gt-filter = { path = "crates/gt-filter" }
gt-fmt = { path = "crates/gt-fmt" }
gt-history = { path = "crates/gt-history" }
gt-loaded-files = { path = "crates/gt-loaded-files" }
gt-loader = { path = "crates/gt-loader" }
gt-logfile = { path = "crates/gt-logfile" }
gt-map = { path = "crates/gt-map" }
gt-plot = { path = "crates/gt-plot" }
gt-query = { path = "crates/gt-query" }
gt-side-panel = { path = "crates/gt-side-panel" }
gt-sky = { path = "crates/gt-sky" }
gt-snap = { path = "crates/gt-snap" }
gt-track-builder = { path = "crates/gt-track-builder" }
gt-types = { path = "crates/gt-types" }
gt-ui-theme = { path = "crates/gt-ui-theme" }
gt-ui-types = { path = "crates/gt-ui-types" }
log.workspace = true
mimalloc = { version = "0.1.48", features = ["v3"] }
parking_lot.workspace = true
rfd = "0.17.2"
semver = "1"
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
# Current-thread runtime for driving axoupdater's async API off the UI thread.
tokio = { version = "1", features = ["rt", "net", "time"] }
toml = "1"
uom.workspace = true

# Embeds the app icon into the Windows executable (see build.rs). No-op elsewhere.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[dev-dependencies]
egui_kittest.workspace = true
geotrace-sdk = { path = "sdk/rust/geotrace-sdk" }
gt-test-utils = { path = "crates/gt-test-utils", features = ["snapshot"] }
rstest.workspace = true
tempfile.workspace = true

# The self-updater end-to-end test only builds with the updater compiled in, so
# the `--update` flag it drives exists. See tests/self_update.rs.
[[test]]
name = "self_update"
required-features = ["self-update"]

[profile.release]
opt-level = 3
debug = false
panic = "abort"
strip = true
lto = true
codegen-units = 1

[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev]
debug = "line-tables-only"

# Optimize all dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Full optimization for the hottest crates: mipmap binary search, plot
# rendering, and egui_plot layout are the main performance bottlenecks in debug
# builds.
[profile.dev.package.gt-egui-mipmap]
opt-level = 3

[profile.dev.package.gt-plot]
opt-level = 3

[profile.dev.package.egui_plot]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints]
workspace = true
