[profile.default]
# The gt-snap live-API smoke test carries `#[ignore]`, so every runner skips
# it by default; `just snap-live-test` (the `live` profile below) opts in.
# Print each failure's output as it happens and again in a summary at the end,
# so failures stay visible at the bottom of long CI logs. Inherited by the ci
# profile below.
failure-output = "immediate-final"

[profile.ci]
fail-fast = false
status-level = "all"

# On-demand live tests against the real map-matching server. One thread so
# a run stays within the server's 1 request/s fair-use budget.
[profile.live]
default-filter = "binary_id(gt-snap::live_api)"
status-level = "all"

[[profile.live.overrides]]
filter = "binary_id(gt-snap::live_api)"
test-group = "live"

[test-groups]
live = { max-threads = 1 }
