[package]
name = "geotrace-c"
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
# SDK version line, independent of the GUI app. Keep in lockstep with
# geotrace-sdk / geotrace-sdk-macros / geotrace-py (see geotrace-sdk/Cargo.toml).
version = "0.2.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[package.metadata.dist]
# Excluded from dist: SDKs release on their own track (geotrace-sdk-v* tags).
# This also keeps the `gen_fixture` bin below out of the GUI release.
dist = false

[lib]
crate-type = ["cdylib", "staticlib"]
doctest = false
test = false

[[bin]]
name = "gen_fixture"

[dependencies]
chrono.workspace = true
geotrace-sdk = { path = "../geotrace-sdk" }

[lints]
workspace = true
