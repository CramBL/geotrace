[package]
name = "geotrace-sdk"
description = "SDK for generating geotrace (.gtd) files"
# The SDK has its own release cadence, independent of the GUI app (which uses
# `version.workspace`). Keep this in lockstep with the other SDK crates
# (geotrace-sdk-macros, geotrace-c) and sdk/python/geotrace-py; bump them
# together and tag SDK releases as `geotrace-sdk-vX.Y.Z`.
version = "0.2.0-rc.1"
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version = "1.89"
authors.workspace = true
license = "MIT"
readme = "README.md"

[package.metadata.dist]
# Excluded from dist: SDKs release on their own track (geotrace-sdk-v* tags).
dist = false

[lib]

[dependencies]
bon.workspace = true
chrono.workspace = true
geotrace-sdk-macros = { path = "../geotrace-sdk-macros", version = "0.2.0-rc.1" }
hdf5-pure.workspace = true
log.workspace = true
strum.workspace = true
thiserror.workspace = true
uom.workspace = true

[dev-dependencies]
hdf5-pure.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
