[package]
name = "geotrace-sdk"
description = "SDK for generating geotrace (.gtd) files"
# The SDK has its own release cadence, independent of the GUI app (which uses
# `version.workspace`). Keep this in lockstep with the other SDK crates
# (geotrace-sdk-macros, geotrace-c) and sdk/python/geotrace-py. Bump them
# together and tag SDK releases as `geotrace-sdk-vX.Y.Z`.
version = "0.6.0"
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version = "1.89"
authors.workspace = true
license = "MIT"
readme = "README.md"
# The integration tests build on geotrace-sdk-test-util, a path-only
# dev-dependency that `cargo publish` removes from the published manifest.
exclude = ["tests/"]

# cargo-shear sees the `trybuild` fixtures as unlinked: the test in
# tests/compile_fail.rs compiles them, not cargo.
[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]

[package.metadata.dist]
# Excluded from dist: SDKs release on their own track (geotrace-sdk-v* tags).
dist = false

[lib]

[dependencies]
bon.workspace = true
chrono.workspace = true
geotrace-sdk-macros = { path = "../geotrace-sdk-macros", version = "0.6.0" }
geotrace-sdk-units = { path = "../geotrace-sdk-units", version = "0.6.0" }
hdf5-pure.workspace = true
log.workspace = true
strum.workspace = true
thiserror.workspace = true
uom.workspace = true

[build-dependencies]
chrono.workspace = true

[dev-dependencies]
geotrace-sdk-test-util = { path = "../geotrace-sdk-test-util" }
hdf5-pure.workspace = true
insta.workspace = true
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true
trybuild.workspace = true

[lints]
workspace = true
