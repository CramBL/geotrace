[package]
name = "geotrace-sdk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The parent workspace lists its members explicitly and never includes this one.
[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[dependencies]
geotrace-sdk = { path = ".." }
libfuzzer-sys = "0.4"
