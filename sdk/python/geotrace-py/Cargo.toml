# Isolated workspace - not a member of the root workspace.
# Built exclusively by maturin; the Python CI job handles it separately.
[workspace]

[package]
name = "geotrace-py"
version = "0.2.0-rc.1"
edition = "2024"
license = "MIT"
description = "Python bindings for geotrace-sdk"

[lib]
name = "_geotrace_sdk"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
geotrace-sdk = { path = "../../rust/geotrace-sdk" }
# abi3-py312: build a single stable-ABI wheel (cp312-abi3) that runs on 3.12 and
# every later CPython, instead of one wheel per interpreter. `extension-module`
# is intentionally NOT enabled here — maturin turns it on at build time via the
# `[tool.maturin] features` key in pyproject.toml, which keeps plain `cargo`
# builds (e.g. tests) able to link libpython.
pyo3 = { version = "0.28.3", features = ["abi3-py312", "chrono"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
needless_pass_by_value = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
