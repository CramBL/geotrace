# Isolated workspace - not a member of the root workspace.
# Built exclusively by maturin; the Python CI job handles it separately.
[workspace]

[package]
name = "geotrace-py"
version = "0.2.0-rc.1"
edition = "2024"
license = "MIT"
description = "Python bindings for geotrace-sdk"

[lib]
name = "_geotrace_sdk"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
geotrace-sdk = { path = "../../rust/geotrace-sdk" }
pyo3 = { version = "0.28.3", features = ["extension-module", "chrono"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
needless_pass_by_value = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
