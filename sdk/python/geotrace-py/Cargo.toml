
[package]
name = "geotrace-py"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "Python bindings for geotrace-sdk"
homepage = "https://github.com/CramBL/geotrace"
repository = "https://github.com/CramBL/geotrace"

# Isolated workspace - not a member of the root workspace: a PyO3 cdylib needs
# unwinding, which the root's `panic = "abort"` release profile takes away.
# maturin builds it, and the justfile's checks run over it by manifest path.
[workspace]

[lib]
name = "_geotrace_sdk"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
geotrace-sdk = { path = "../../rust/geotrace-sdk" }
log = "0.4"
# abi3-py312: build a single stable-ABI wheel (cp312-abi3) that runs on 3.12 and
# every later CPython, instead of one wheel per interpreter. `extension-module`
# is intentionally NOT enabled here. maturin turns it on at build time via the
# `[tool.maturin] features` key in pyproject.toml, which keeps plain `cargo`
# builds (e.g. tests) able to link libpython.
pyo3 = { version = "0.29", features = ["abi3-py312", "chrono"] }
pyo3-log = "0.13"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
needless_pass_by_value = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
