[project]
name = "qa"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
check-all = "qa.run_all:main"
check-em-dash = "qa.check_em_dash:main"
check-floating-comments = "qa.check_floating_comments:main"
check-narrative-comments = "qa.check_narrative_comments:main"
generate-gold = "qa.generate_gold_dataset:main"
versions = "qa.versions:main"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
