[project]
name = "qa"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
check-em-dash = "qa.check_em_dash:main"
check-floating-comments = "qa.check_floating_comments:main"
qa-lint = "qa.lint:main"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
