<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Navigation arrow outline: the closed white rim drawn on top of
       nav_arrow_fill.svg (same geometry, see there). stroke-width is in
       physical pixels, not user units: the gt-map build script bakes this
       asset with StrokeWidthUnit::PhysicalPixels so the rim keeps the
       painter path's constant 1.5 px width at every zoom size instead of
       scaling with the arrow. -->
  <path d="M 12 0 L 18 16.8 L 12 13.2 L 6 16.8 Z" fill="none"
        stroke="white" stroke-width="1.5" stroke-linejoin="miter"/>
</svg>
