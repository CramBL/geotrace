<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Stem -->
  <line x1="10" y1="14" x2="10" y2="4"
        stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polyline points="5.5,7.5 10,2.5 14.5,7.5"
            fill="none" stroke="#4285F4" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tray -->
  <line x1="3" y1="17" x2="17" y2="17"
        stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="3" y1="14.5" x2="3" y2="17"
        stroke="#4285F4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="17" y1="14.5" x2="17" y2="17"
        stroke="#4285F4" stroke-width="1.8" stroke-linecap="round"/>
</svg>
