<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="#607080" stroke="white" stroke-width="1.5"
     stroke-linejoin="round" paint-order="stroke fill"
     transform="rotate(-45 12 12)">
    <!-- Left solar panel -->
    <rect x="0.75" y="9.5" width="6" height="5" rx="0.5"/>
    <!-- Body -->
    <rect x="8.5" y="6.5" width="7" height="11" rx="0.75"/>
    <!-- Right solar panel -->
    <rect x="17.25" y="9.5" width="6" height="5" rx="0.5"/>
  </g>
  <!-- Prohibition ring + horizontal bar: white halos first, red on top -->
  <circle cx="12" cy="12" r="6" stroke="white" stroke-width="3.5" fill="none"/>
  <line x1="6" y1="12" x2="18" y2="12" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="12" cy="12" r="6" stroke="#CC0000" stroke-width="2" fill="none"/>
  <line x1="6" y1="12" x2="18" y2="12" stroke="#CC0000" stroke-width="2" stroke-linecap="round"/>
</svg>
