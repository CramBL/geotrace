# The subject line is a sentence: a capital first letter and no trailing
# period, after an optional lowercase tag ("ci: Run the fuzz targets"). This
# is the convention GNOME's handbook states.
extends: existence
message: "Commit subject: '%s'. A capital first letter after an optional lowercase 'tag: ', no trailing period."
level: error
scope: raw
nonword: true
tokens:
  - '\A(?![a-z][a-z0-9_./-]*: )[a-z]'
  - '\A[a-z][a-z0-9_./-]*: [a-z]'
  - '\A[^\n]*\.(?:\n|\z)'
