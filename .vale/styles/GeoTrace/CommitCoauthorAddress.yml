# Co-authored-by states "Name <address>", the form git and GitHub read an
# author from. A GitHub noreply address satisfies it.
extends: existence
message: "Co-authored-by without an address: '%s'. Write 'Name <address>'. A GitHub noreply address is fine."
level: error
scope: raw
nonword: true
tokens:
  - '(?mi)^Co-authored-by:(?![^\n]*<[^\s@<>]+@[^\s@<>]+>)[^\n]*'
