[package]
name = "gt-store"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false

[features]
default = ["backend-sys"]
# Forwarded to gt-history, which is where the two HDF5 backends live. The
# interference, geomagnetic, TEC and solar flare archives are sys-only.
backend-pure = ["gt-history/backend-pure"]
backend-sys = ["gt-history/backend-sys"]

[dependencies]
chrono.workspace = true
dirs.workspace = true
gt-flare = { path = "../gt-flare" }
gt-flare-store = { path = "../gt-flare-store" }
gt-hdf5-archive = { path = "../gt-hdf5-archive" }
gt-history = { path = "../gt-history", default-features = false }
gt-ionex-store = { path = "../gt-ionex-store" }
gt-jam = { path = "../gt-jam" }
gt-jam-store = { path = "../gt-jam-store" }
gt-pending-writes = { path = "../gt-pending-writes" }
gt-solar-store = { path = "../gt-solar-store" }
log.workspace = true
parking_lot.workspace = true
strum.workspace = true
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
hdf5-pure.workspace = true
rstest.workspace = true
tempfile.workspace = true
test-log.workspace = true

[lints]
workspace = true
