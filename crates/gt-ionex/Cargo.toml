[package]
name = "gt-ionex"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false

[dependencies]
# The `serde` feature dates the node-series fixture's days.
chrono = { workspace = true, features = ["serde"] }
# The archives serve IONEX files gzipped, and the parser reads text.
flate2.workspace = true
gt-fetch = { path = "../gt-fetch" }
gt-fmt = { path = "../gt-fmt" }
gt-types = { path = "../gt-types" }
gt-ui-types = { path = "../gt-ui-types" }
serde.workspace = true
# The node-series fixture is JSON: a month of published files would not be
# committable, and the values behind the storm index must be.
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
# The fixture-capture example talks to the archive directly, not through
# gt_fetch::Transport.
reqwest.workspace = true
rstest.workspace = true

[lints]
workspace = true
