[package]
name = "gt-analysis"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false

[dependencies]
gt-types = { path = "../gt-types" }
vec1.workspace = true

[dev-dependencies]
chrono.workspace = true
# The fixture builders of `gt_types::fixtures`, which the tests build their nav
# points and satellites with. The feature is off in a normal build of gt-types.
gt-types = { path = "../gt-types", features = ["fixtures"] }
proptest.workspace = true
rstest.workspace = true

[lints]
workspace = true
