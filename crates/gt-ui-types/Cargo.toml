[package]
name = "gt-ui-types"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# cargo-shear sees the `trybuild` fixtures as unlinked: the test harness
# compiles them, not cargo.
[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]

[lib]
doctest = false

[dependencies]
chrono.workspace = true
gt-filter = { path = "../gt-filter" }
gt-fmt = { path = "../gt-fmt" }
gt-logfile = { path = "../gt-logfile" }
gt-types = { path = "../gt-types" }
rustc-hash.workspace = true
serde.workspace = true
smallvec.workspace = true
strum.workspace = true

[dev-dependencies]
gt-track-builder = { path = "../gt-track-builder" }
gt-types = { path = "../gt-types", features = ["fixtures"] }
proptest.workspace = true
rstest.workspace = true
serde_json.workspace = true
trybuild.workspace = true

[lints]
workspace = true
