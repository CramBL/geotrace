[package]
name = "gt-mcp"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
gt-session-bridge = { path = "../gt-session-bridge", features = ["schema"] }
rmcp = { version = "3.11.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
chrono.workspace = true
gt-query = { path = "../gt-query" }
gt-types = { path = "../gt-types" }
tokio = { version = "1", features = ["io-util", "sync", "time"] }
uuid.workspace = true

[lints]
workspace = true
