[package]
name = "gt-map"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false

[dependencies]
bon.workspace = true
bytemuck.workspace = true
chrono.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
egui-wgpu.workspace = true
gt-filter = { path = "../gt-filter" }
gt-fmt = { path = "../gt-fmt" }
gt-icon-tessellate = { path = "../gt-icon-tessellate", default-features = false }
gt-sky = { path = "../gt-sky" }
gt-track-builder = { path = "../gt-track-builder" }
gt-types = { path = "../gt-types" }
gt-ui-theme = { path = "../gt-ui-theme" }
gt-ui-types = { path = "../gt-ui-types" }
log.workspace = true
postcard.workspace = true
rstar.workspace = true
smallvec.workspace = true
strum.workspace = true
thiserror.workspace = true
uom.workspace = true
walkers.workspace = true

[build-dependencies]
gt-icon-tessellate = { path = "../gt-icon-tessellate" }
postcard.workspace = true

[dev-dependencies]
criterion.workspace = true
egui_kittest.workspace = true
gt-test-utils = { path = "../gt-test-utils", features = ["snapshot"] }
# Only for reading back rendered frames in projection tests; this is the same
# `image` version egui_kittest's `Harness::render` returns. No codec features:
# the frames come from `Harness::render` in memory, never decoded from a file.
image = { version = "0.25", default-features = false }
proptest.workspace = true
rstest.workspace = true
vec1.workspace = true

[[bench]]
name = "icon_batch"
harness = false

[lints]
workspace = true
