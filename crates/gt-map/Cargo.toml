[package]
name = "gt-map"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false

[features]
# Builds `gt_map::test_util`, the harness the crate's integration test binaries
# draw a map through. A normal build leaves it off.
test-util = ["dep:gt-test-utils"]

[dependencies]
bon.workspace = true
bytemuck.workspace = true
chrono.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
egui-wgpu.workspace = true
gt-filter = { path = "../gt-filter" }
gt-fmt = { path = "../gt-fmt" }
gt-icon-tessellate = { path = "../gt-icon-tessellate", default-features = false }
gt-ionex = { path = "../gt-ionex" }
gt-jam = { path = "../gt-jam" }
gt-loaded-files = { path = "../gt-loaded-files" }
gt-logfile = { path = "../gt-logfile" }
gt-sky = { path = "../gt-sky" }
# Builds the fixtures and drives the harness of `test_util`, which the
# `test-util` feature exposes to the integration test binaries.
gt-test-utils = { path = "../gt-test-utils", features = [
    "snapshot",
], optional = true }
gt-track-builder = { path = "../gt-track-builder" }
gt-types = { path = "../gt-types" }
gt-ui-theme = { path = "../gt-ui-theme" }
gt-ui-types = { path = "../gt-ui-types" }
h3o.workspace = true
log.workspace = true
postcard.workspace = true
rstar.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
strum.workspace = true
thiserror.workspace = true
uom.workspace = true
walkers.workspace = true

[build-dependencies]
gt-icon-tessellate = { path = "../gt-icon-tessellate" }
postcard.workspace = true

[dev-dependencies]
criterion.workspace = true
egui_kittest.workspace = true
gt-geo-math = { path = "../gt-geo-math" }
# The crate's own harness, which the integration test binaries draw through.
gt-map = { path = ".", features = ["test-util"] }
gt-test-utils = { path = "../gt-test-utils", features = ["snapshot"] }
# Reads back rendered frames in projection tests, encodes the reference
# illustration asset, and writes the JPEG and PNG tiles the fixture tests
# serve. The same `image` version egui_kittest's `Harness::render` returns.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
proptest.workspace = true
reqwest.workspace = true
rstest.workspace = true
tempfile.workspace = true
vec1.workspace = true

[[bench]]
name = "icon_batch"
harness = false

[lints]
workspace = true
