[package]
name = "gt-test-utils"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["tracks"]
archive = ["dep:gt-hdf5-archive", "dep:hdf5"]
ionex = ["dep:gt-ionex"]
snapshot = [
    "dep:egui",
    "dep:image",
    "dep:egui_kittest",
    "dep:egui-wgpu",
    "dep:gt-ui-theme",
    "dep:tempfile",
    "dep:eframe",
]
# The loaded-track and loaded-file builders, which measure a track through
# gt-track-builder. Off for a crate gt-track-builder itself depends on.
tracks = ["dep:gt-track-builder", "dep:vec1"]

[dependencies]
chrono.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
egui_kittest = { workspace = true, optional = true }
geo.workspace = true
geo-types.workspace = true
geotrace-sdk = { path = "../../sdk/rust/geotrace-sdk" }
gt-fetch = { path = "../gt-fetch" }
gt-hdf5-archive = { path = "../gt-hdf5-archive", optional = true }
gt-ionex = { path = "../gt-ionex", optional = true }
gt-pending-writes = { path = "../gt-pending-writes" }
gt-track-builder = { path = "../gt-track-builder", optional = true }
gt-types = { path = "../gt-types", features = ["fixtures"] }
gt-ui-theme = { path = "../gt-ui-theme", optional = true }
hdf5 = { workspace = true, optional = true }
# Compares rendered frames in `snapshot_harness`. The same `image` version
# `egui_kittest`'s `Harness::render` returns. No codec features: the frames
# never leave memory.
image = { version = "0.25", default-features = false, optional = true }
parking_lot.workspace = true
tempfile = { workspace = true, optional = true }
uom.workspace = true
vec1 = { workspace = true, optional = true }

[lints]
workspace = true
