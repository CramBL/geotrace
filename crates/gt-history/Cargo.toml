[package]
name = "gt-history"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false
test = false

[features]
# The system-HDF5 backend is the default: it edits the history file in place
# (insert/delete without rewriting the whole file) and tracks free space. The
# pure-Rust backend stays available as a zero-C-dependency fallback.
default = ["backend-sys"]
backend-pure = []
backend-sys = ["dep:gt-history-backend-sys"]

[dependencies]
dirs.workspace = true
gt-history-backend-pure = { path = "../gt-history-backend-pure" }
gt-history-backend-sys = { path = "../gt-history-backend-sys", optional = true }
gt-types = { path = "../gt-types" }

[dev-dependencies]
geotrace-sdk = { path = "../../sdk/rust/geotrace-sdk" }
hdf5 = { package = "hdf5-metno", version = "0.12.5" }
hdf5-pure.workspace = true
log.workspace = true
tempfile.workspace = true
test-log.workspace = true

[lints]
workspace = true
