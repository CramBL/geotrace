[package]
name = "gt-snap"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false
# The wire and capture checks are integration tests, and `test = false` drops
# the lib's own test harness from the build.
test = false

[dependencies]
gt-fetch = { path = "../gt-fetch" }
gt-types = { path = "../gt-types" }
parking_lot.workspace = true
polyline.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true

[dev-dependencies]
chrono.workspace = true
geo-types.workspace = true
# Responds to a fetch pipeline's requests from a script.
gt-fetch = { path = "../gt-fetch", features = ["test-util"] }
gt-test-utils = { path = "../gt-test-utils" }
insta.workspace = true
proptest.workspace = true
rstest.workspace = true

[lints]
workspace = true
