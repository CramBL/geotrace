[package]
name = "gt-session-bridge"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false

[features]
schema = ["dep:schemars"]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gt-fmt = { path = "../gt-fmt" }
gt-history-types = { path = "../gt-history-types" }
gt-loaded-files = { path = "../gt-loaded-files" }
gt-query = { path = "../gt-query" }
gt-query-run = { path = "../gt-query-run" }
gt-types = { path = "../gt-types" }
interprocess = { version = "2.4.9", features = ["tokio"] }
log.workspace = true
parking_lot.workspace = true
schemars = { version = "1", features = ["chrono04", "uuid1"], optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
strum.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uom.workspace = true
uuid = { workspace = true, features = ["serde"] }
xxhash-rust.workspace = true

[dev-dependencies]
geotrace-sdk = { path = "../../sdk/rust/geotrace-sdk" }
gt-loader = { path = "../gt-loader" }
gt-query-run = { path = "../gt-query-run", features = ["test-util"] }
gt-test-utils = { path = "../gt-test-utils" }
proptest.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
widestring = "1"
win-custody = "0.1.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
