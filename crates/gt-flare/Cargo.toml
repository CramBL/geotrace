[package]
name = "gt-flare"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false

[features]
# Builds `gt_flare::test_util`, which reads the captured responses under
# `tests/fixtures/`. A normal build leaves it off.
test-util = []

[dependencies]
chrono.workspace = true
gt-fetch = { path = "../gt-fetch" }
gt-fmt = { path = "../gt-fmt" }
gt-types = { path = "../gt-types" }
gt-ui-types = { path = "../gt-ui-types" }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Responds to a fetch pipeline's requests from a script.
gt-fetch = { path = "../gt-fetch", features = ["test-util"] }
# Builds `test_util`, which the integration test binaries read the
# captures through.
gt-flare = { path = ".", features = ["test-util"] }
insta.workspace = true
proptest.workspace = true
# The fixture-capture example sends its requests to the endpoint directly,
# not through gt_fetch::Transport.
reqwest.workspace = true
rstest.workspace = true

[lints]
workspace = true
