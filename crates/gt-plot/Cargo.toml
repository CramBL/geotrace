[package]
name = "gt-plot"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
doctest = false

[features]
# Builds `gt_plot::test_util`, the recordings and the harness the integration
# test binaries draw the plot with. A normal build leaves it off.
test-util = ["dep:gt-test-utils"]

[dependencies]
chrono.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
egui_plot.workspace = true
geotrace-sdk-units = { path = "../../sdk/rust/geotrace-sdk-units" }
gt-analysis = { path = "../gt-analysis" }
gt-egui-mipmap = { path = "../gt-egui-mipmap" }
gt-filter = { path = "../gt-filter" }
gt-flare = { path = "../external_environmental_data/gt-flare" }
gt-fmt = { path = "../gt-fmt" }
gt-ionex = { path = "../external_environmental_data/gt-ionex" }
gt-jam = { path = "../external_environmental_data/gt-jam" }
gt-loaded-files = { path = "../gt-loaded-files" }
gt-solar = { path = "../external_environmental_data/gt-solar" }
# Builds the recordings and drives the harness of `test_util`, which the
# `test-util` feature exposes to the integration test binaries.
gt-test-utils = { path = "../gt-test-utils", features = [
    "snapshot",
], optional = true }
gt-types = { path = "../gt-types" }
gt-ui-theme = { path = "../gt-ui-theme" }
gt-ui-types = { path = "../gt-ui-types" }
rayon.workspace = true
rustc-hash.workspace = true
strum.workspace = true
uom.workspace = true

[dev-dependencies]
gt-loader = { path = "../gt-loader" }
# The crate's own recordings and harness, which the integration test binaries
# draw the plot with.
gt-plot = { path = ".", features = ["test-util"] }
gt-test-utils = { path = "../gt-test-utils", features = ["snapshot"] }
rstest.workspace = true
vec1.workspace = true

[lints]
workspace = true
