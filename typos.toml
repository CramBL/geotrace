[files]
extend-exclude = [
    "sdk/python/geotrace-py/target",
    "tests/fixtures/demo_trip/markers.csv",
    # Captured interference datasets: H3 cell indices are hex strings, not words
    "crates/external_environmental_data/gt-jam/tests/captures/*.csv",
    # Captured IONEX maps: four-letter IGS station codes are not words
    "crates/external_environmental_data/gt-ionex/tests/captures/*",
]

[default.extend-words]
# Level of Detail - standard graphics acronym, not a misspelling of "LOAD"
LOD = "LOD"
# Wide Area Augmentation System - SBAS network operated by the FAA
WAAS = "WAAS"
# Git SHA hex fragments (e.g. 80a9caf, ba70f12, 7d0ba21) are not English words
ba = "ba"
caf = "caf"
# PN appears in the plural of PNG, the image format
PN = "PN"
# Extreme Ultraviolet and X-ray Irradiance Sensors, the GOES instrument the
# flare catalog names in every event
EXIS = "EXIS"
# foF2, the F2 layer critical frequency, in the title of a cited paper
fo = "fo"
# clang-tidy spells its opt-in check group `optin`, as in the check
# `clang-analyzer-optin.core.EnumCastOutOfRange`
optin = "optin"
